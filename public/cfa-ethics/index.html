uestion":"Edwin McNeill, CFA, is a senior trader for Grey Securities. In his monthly review of his team’s activity, McNeill notices a series of suspicious trades by one of the traders. McNeill consults his manager, who agrees that these trades are a potential violation. McNeill informs the trader that her duties will be restricted while these trades are being investigated and refers the matter to Grey's compliance officer for further action. McNeill has:","choices":{"A":"not violated the Standards.","B":"violated Standard IV(C) Responsibilities of Supervisors by failing to prevent a potential violation.","C":"violated Standard IV(C) Responsibilities of Supervisors by restricting the trader’s duties before the investigation is completed."},"correct":"A","solution":"A is correct. By reviewing the employee's conduct, restricting the employee's activities while investigating a potential violation, and referring the matter to his manager and compliance officer, McNeill acted properly according to Standard IV(C) Responsibilities of Supervisors. Wrongdoing by a subordinate does not mean the manager has violated Standard IV(C) as long as the manager has made reasonable efforts to detect and prevent violations.29"},{"id":63,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":40,"section":"C. RESPONSIBILIES TO SUPERVISORS","question":"Joan Tasha, CFA, a supervisor at Olympia Advisors (OA), wrote and implemented compliance policies at her firm. A long-time OA employee, Derek Longtree, recently changed the asset allocation of a client, which is inconsistent with her financial needs and objectives and with OA’s policies. Until now, Longtree has never violated OA’s policies. Tasha discusses the issue with Longtree but takes no further action. Do Tasha’s actions concerning Longtree most likely violate any CFA Institute Standards of Professional Conduct?","choices":{"A":"No.","B":"Yes, because she failed to detect Longtree’s actions.","C":"Yes, because she did not take steps to ensure that the violation will not be repeated"},"correct":"C","solution":"C is correct. as once a supervisor learns that an employee has violated or may have violated the law or the Code and Standards, the supervisor must promptly initiate an investigation to ascertain the extent of the wrongdoing as required by Standard IV(C)–Responsibilities of Supervisors. Relying on an employee’s statements about the extent of the violation or assurances that the wrongdoing will not recur is not enough. Reporting the misconduct up the chain of command and warning the employee to cease the activity are also not enough. Pending the outcome of the investigation, a supervisor should take steps to ensure that the violation will not be repeated, such as placing limits on the employee’s activities or increasing the monitoring of the employee’s activities."},{"id":64,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":41,"section":"A. DILLIGENCE & REASONABLE BASIS","question":"Willier is the research analyst responsible for following Company X. All the information he has accumulated and documented suggests that the outlook for the company’s new products is poor, so the stock should be rated a weak “hold.” During lunch, however, Willier overhears a financial analyst from another firm whom he respects offer opinions that conflict with Willier’s forecasts and expectations. Upon returning to his office, Willier releases a strong “buy” recommendation to the public. Willier:","choices":{"A":"Violated the Standards by failing to distinguish between facts and opinions in his recommendation.","B":"Violated the Standards because he did not have a reasonable and adequate basis for his recommendation.","C":"Was in full compliance with the Standards."},"correct":"B","solution":"B is correct. This question relates to Standard V(A)–Diligence and Reasonable Basis. The opinion of another financial analyst is not an adequate basis for Willier’s action in changing the recommendation. Answer C is thus incorrect. So is answer A because, although it is true that members and candidates must distinguish between facts and opinions in recommendations, the 30 question does not illustrate a violation of that nature. If the opinion overheard by Willier had sparked him to conduct additional research and investigation that justified a change of opinion, then a changed recommendation would be appropriate."},{"id":65,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":42,"section":"A. DILLIGENCE & REASONABLE BASIS","question":"Moe Girard, CFA, works in a large group that decides on recommendations by consensus. Girard does not always agree with the group consensus, but he is confident in the group's analytical ability. To comply with the Code and Standards when the group issues a recommendation with which he disagrees, Girard:","choices":{"A":"does not need to take any action.","B":"must request that his name be removed from the group’s report.","C":"should include his independent opinion as an appendix to the group’s report."},"correct":"A","solution":"A is correct. Standard V(A) does not require a Member to dissociate from a group recommendation, as long as the opinion has a reasonable and adequate basis."},{"id":66,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":43,"section":"B. COMMUNICATIONS WITH CLIENTS & PROSPECTIVE CLIENTS","question":"Scott works for a regional brokerage firm. He estimates that Walkton Industries will increase its dividend by US$1.50 a share during the next year. He realizes that this increase is contingent on pending legislation that would, if enacted, give Walkton a substantial tax break. The US representative for Walkton’s home district has told Scott that, although she is lobbying hard for the bill and prospects for its passage are favorable, concern of the US Congress over the federal deficit could cause the tax bill to be voted down. Walkton Industries has not made any statements about a change in dividend policy. Scott writes in his research report, “We expect Walkton’s stock price to rise by at least US$8.00 a share by the end of the year because the dividend will increase by US$1.50 a share. Investors buying the stock at the current time should expect to realize a total return of at least 15% on the stock.” According to the Standards:","choices":{"A":"Scott violated the Standards because he used material inside information.","B":"Scott violated the Standards because he failed to separate opinion from fact.","C":"Scott violated the Standards by basing his research on uncertain predictions of future government action."},"correct":"B","solution":"B is correct. This question relates to Standard V(B)–Communication with Clients and Prospective Clients. Scott has issued a research report stating that he expects the price of Walkton Industries stock to rise by US$8 a share “because the dividend will increase” by US$1.50 per share. He has made this statement knowing that the dividend will increase only if Congress enacts certain legislation, an uncertain prospect. By stating that the dividend will increase, Scott failed to separate fact from opinion. The information regarding passage of legislation is not material nonpublic information because it is conjecture, and the question does not state whether the US representative gave Scott her 31 opinion on the passage of the legislation in confidence. She could have been offering this opinion to anyone who asked. Therefore, statement A is incorrect. It may be acceptable to base a recommendation, in part, on an expectation of future events, even though they may be uncertain. Therefore, answer C is incorrect."},{"id":67,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":44,"section":"B. COMMUNICATIONS WITH CLIENTS & PROSPECTIVE CLIENTS","question":"Priscilla Moab, CFA, is the director of marketing at Red Lantern Investments. Red’s investment approach uses technical and fundamental analysis as well as portfolio construction to minimize risk. Moab plans to market an online investment newsletter to retail clients. Moab decides to let prospective clients have access to Red’s buy and sell recommendation list by posting this information on a social media site. The posting also provides information on Red’s basic investment process and logic. To avoid violating the CFA Institute Code of Ethics and Standards of Professional Conduct, Moab should most likely:","choices":{"A":"describe the investment approach in detail.","B":"update investment process changes annually.","C":"indicate that additional information and analysis are available."},"correct":"C","solution":"C is correct. If recommendations are contained in capsule form (such as a recommended stock list), members and candidates should notify clients that additional information and analysis are available from the producer of the report as required by Standard V(B) – Communication with Clients and Prospective Clients. In this case, a clear statement on the website that more information is available upon request would be required. A is incorrect because Moab’s plans for the social media recommendations do not violate Standard V(B) – Communication with Clients and Prospective Clients, so it does not need to describe the investment system in detail. The recommendation outlines the basic process and logic of Red’s investment approach and is sufficient enough for clients to understand its limitations or inherent risks. B is incorrect because according to Standard V(B) – Communication with Clients and Prospective Clients, the member or candidate must keep clients and other interested parties informed on an ongoing basis about changes to the investment process, and an annual update may not be sufficient."},{"id":68,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":45,"section":"C. RECORD RETENTION","question":"An analyst has constructed an investment policy statement (IPS) and a portfolio for a new Client, Susan Stevens. He has also provided written guidelines on the processes used to make investment management decisions. Six month later, Stevens questions the analyst about several portfolio holdings. Although the analyst cannot remember his reasoning for recommending specific securities, and cannot find supporting documents, he assures her that the recommendations were made within the limits of her IPS and the firm’s stated processes for making investment management decisions. Stevens is not satisfied by this response, but leaves the portfolio unchanged. The analyst has most likely violated:","choices":{"A":"Standard V(B) Communications with Clients and Prospective Clients.","B":"Standard V(C) Record Retention.32","C":"Standard III(C) Suitability"},"correct":"B","solution":"B is correct. Standard V(C) Record Retention requires analysts to develop and maintain “…records to support their investment analysis, recommendations…with clients and prospective clients.” The analyst is unable to explain why securities were added to the portfolio; this is a violation of Standard V(C)."},{"id":69,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":46,"section":"C. RECORD RETENTION","question":"Gregor Pavlov, CFA, is a fund manager working for the general partner of a new private equity fund. Pavlov includes in the fund marketing material his performance history from his previous employer. He received permission from his former employer to take his historical recommendations and the supporting research reports he used to make those recommendations. Did Pavlov most likely violate the CFA Institute Standards?","choices":{"A":"No","B":"Yes, with regard to Loyalty","C":"Yes, with regard to Record Retention"},"correct":"C","solution":"C is correct. Even though Pavlov had his former employer’s permission to take his performance record and supporting research reports with him, he does not have the underlying performance data to support those historical recommendations and is therefore most likely in violation of Standard V(C) – Record Retention. Pavlov had the permission of his employer to take his historical performance record and research reports with him when he left the firm so he is not in violation of Standard IV(A) – Loyalty."},{"id":70,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":47,"section":"A. AVOID OR DISCLOSE CONFLICTS","question":"Rhonda Morrow, CFA, is an analyst for Waller & Madison, a brokerage and investment banking firm. Waller & Madison is a market maker for CorpEast, and Tim Waller, a principal in Morrow's firm, sits on CorpEast's board. Morrow has been asked to write a research report on CorpEast. According to the Standard regarding avoid or disclose conflicts, Morrow:","choices":{"A":"must disclose that Waller & Madison is a market maker in CorpEast shares but not that Waller is a board member.","B":"must not write the report.","C":"may write the report if she discloses both that Waller & Madison is a market maker in CorpEast shares and that Waller sits on the CorpEast board."},"correct":"C","solution":"C is correct. To comply with Standard VI(A) Avoid or disclose conflicts, both the market\u0002making activities by the firm and the directorship held by a principal in the firm must be 33 disclosed."},{"id":71,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":48,"section":"A. AVOID OR DISCLOSE CONFLICTS","question":"Heidi Katz is a CFA candidate and an analyst at a pension consulting firm. Her father is a major shareholder and managing director at Saturn Partners, a large hedge fund. When assisting in an alternative manager search for a pension client, Katz plans to recommend Saturn’s market\u0002neutral strategy because she feels it meets all of the pension plan’s criteria. Given this situation, the best course of action for Katz is to:","choices":{"A":"not present this strategy to the client and recommend another strategy.","B":"disclose the potential conflict to the pension client when discussing this recommendation.","C":"disclose the potential conflict to her employer and follow their guidance regarding disclosure of her relationship to the client."},"correct":"B","solution":"B is correct. Standard VI(A) requires avoid or disclose conflicts but does not prohibit members from making recommendations as long as the potential conflicts are appropriately disclosed. A is incorrect because if Katz believes the Saturn strategy is the best available choice she can make this recommendation, but she must disclose the relationship with her father’s fund. C is incorrect because even if her employer guides Katz not to disclose a potential conflict, she must still disclose any reasonable influences on her objectivity when making a recommendation to a client or prospective client."},{"id":72,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":49,"section":"A. AVOID OR DISCLOSE CONFLICTS","question":"Smith is a financial analyst with XYZ Brokerage Firm. She is preparing a purchase recommendation on JNI Corporation. Which of the following situations is most likely to represent a conflict of interest for Smith that would have to be disclosed?","choices":{"A":"Smith frequently purchases items produced by JNI.","B":"XYZ holds for its own account a substantial common stock position in JNI.","C":"Smith’s brother-in-law is a supplier to JNI."},"correct":"B","solution":"B is correct. This question involves Standard VI(A)–Avoid or disclose conflicts—specifically, the holdings of an analyst’s employer in company stock. Answers A and C do not describe conflicts of interest that Smith would have to disclose. Answer A describes the use of a firm’s products, which would not be a required disclosure. In answer C, the relationship between the analyst and the company through a relative is so tangential that it does not create a conflict of interest necessitating disclosure."},{"id":73,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":50,"section":"B. PRIORITY OF TRANSACTION","question":"Rose, a portfolio manager for a local investment advisory firm, is planning to sell a portion of his personal investment portfolio to cover the costs of his child’s academic tuition. Rose wants to sell a portion of his holdings in Household Products, but his firm recently upgraded the stock to “strong buy.” Which of the following describes Rose’s options under the Code and Standards?34","choices":{"A":"Based on his firm’s “buy” recommendation, Rose cannot sell the shares because he would be improperly prospering from the inflated recommendation.","B":"Rose is free to sell his personal holdings once his firm is properly informed of his intentions.","C":"Rose can sell his personal holdings but only when a client of the firm places an order to buy shares of Household."},"correct":"B","solution":"B is correct. Standard VI(B) – Priority of Transactions does not limit transactions of company employees that differ from current recommendations as long as the sale does not disadvantage current clients. Thus, answer A is incorrect. Answer C is incorrect because the Standard does not require the matching of personal and client trades."},{"id":74,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":51,"section":"B. PRIORITY OF TRANSACTION","question":"Teresa Avila, CFA, is a micro-cap investment analyst at a hedge fund. The fund requires Avila to hold any securities she recommends for the fund in her own account as well. Because Avila has such a small account, whenever she trades for her own portfolio she combines the transactions with those of the hedge fund so she is sure to have her account aligned with the fund. Has Avila most likely violated any CFA Institute Standards of Professional Conduct?","choices":{"A":"No.","B":"Yes, related to Misconduct.","C":"Yes, related to Priority of Transactions."},"correct":"C","solution":"C is correct. Standard VI(B) requires that investment transactions for clients and employers have priority over transactions in which members have beneficial ownership. By executing her own accounts transactions with those of the hedge fund the analyst has violated this Standard as micro-cap securities can be thinly traded and easily influenced by changes in the volume of activity. So the analyst may benefit when she combines her transactions with the hedge funds and she should let the fund execute its orders before she makes changes to her account."},{"id":75,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":52,"section":"B. PRIORITY OF TRANSACTION","question":"Colleen O’Neil, CFA, manages a private investment fund with a balanced global investment mandate. Her clients insist that her personal investment portfolio replicate the investments within their portfolio to ensure them that she is willing to put her money at risk. By undertaking which of the following simultaneous investment actions for her own portfolio would O’Neil most likely be in violation of Standard VI(B) – Priority of Transactions?","choices":{"A":"Sale of a listed US blue chip value stock.","B":"Participation in a popular frontier market IPO.","C":"Purchase of a UK government bond in the primary market"},"correct":"B","solution":"B is correct. Standard VI(B) – Priority of Transactions dictates that members and candidates give their clients and employer priority when making personal investment transactions. Even when 35 clients allow or insist the manager invest alongside them, the manager’s transactions must never adversely affect the interests of the clients. A popular or “hot” IPO in a frontier market is likely to be oversubscribed. In such cases, Standard VI(B) dictates that the manager should not participate in this event to better ensure that clients would have a higher probability of getting their full subscription allotment, even though clients have allowed or dictated she do so. A is incorrect because the clients are unlikely be harmed by the manager also selling a US blue chip value stock in a stable market as the liquidity of the stock is likely to be large enough that a simultaneous sale would not negatively impact on the price of the share. C is incorrect because the volume of UK government bonds offered through a primary market is likely to be large and at a fixed price based on the auction outcome. O’Neil’s bid would, however, need to be the same as her clients’ bids."},{"id":76,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":53,"section":"C. REFERRAL FEES","question":"Jackson Barnes, CFA, works for an insurance company providing financial planning services to clients for a fee. Barnes has developed a network of specialists, including accountants, lawyers, and brokers, who contribute their expertise to the financial planning process. Each of the specialists is an independent contractor. Each contractor bills Barnes separately for the work he or she performs, providing a discount based upon the number of clients Barnes has referred. What steps should Barnes take to be consistent with the CFA Institute Standards of Professional Conduct?","choices":{"A":"Have his independent contractors approved by the insurance company","B":"List the consideration he receives from the specialists on monthly client invoices","C":"Inform potential clients about his arrangement with the contractors before they agree to hire him"},"correct":"C","solution":"C is correct. The referral arrangements should be disclosed to potential clients “before entry into any formal agreement for services” and not after the fact. This allows potential clients to consider whether the arrangement causes them any potential harm as a result of the arrangement (e.g., higher fees and potential conflicts of interests). A is incorrect as Standard VI(C)–Referral Fees specifically requires referral arrangements be disclosed to clients so this step should be taken regardless of any other additional actions. B is incorrect as the referral arrangements should be disclosed to clients before entry into any formal agreement for services and not after the fact, which would be the case with the disclosure being provided on the bills sent out in arrears."},{"id":77,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":54,"section":"C. REFERRAL FEES","question":"Referral fees a member must disclose to a prospective client include:","choices":{"A":"both fees a member receives and fees a member pays.","B":"only fees a member pays to others for referrals.","C":"only fees a member receives for referrals."},"correct":"A","solution":"36 A is correct. Members and candidates must disclose all referral arrangements to their employer, clients, and prospective clients."},{"id":78,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":55,"section":"A. CONDUCT AS PARTICIPANTS IN CFA PROGRAMS","question":"Tammi Holmberg is enrolled to take the Level I CFA examination. While taking the CFA examination, the candidate on Holmberg’s immediate right takes a stretch break and a piece of paper from his pocket falls onto Holmberg's desk. Holmberg glances at the paper and realizes there is information written on the paper, which includes a formula Holmberg needs for the question she is working on. Holmberg had not memorized this formula and could not complete the question without this information. Holmberg pushes the paper off her desk and uses the formula to complete the question. Holmberg most likely:","choices":{"A":"compromised her exam.","B":"was free to act on the information that fell on her desk.","C":"is responsible for notifying exam proctors of her neighbor’s violation."},"correct":"A","solution":"A is correct. Holmberg’s conduct compromised the validity of her exam and violated Standard VII(A). Her conduct was also a violation of the rules and regulations of the CFA Program, the Candidate pledge, and the CFA Institute Code and Standards. B is incorrect because Holmberg was not free to use the information and her conduct compromised the validity of her exam and violated Standard VII(A). C is incorrect because Holmberg has an obligation to report her violation but does not have an obligation to report potential violations of the Code and Standards by fellow members, even though CFA Institute encourages such action."},{"id":79,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":56,"section":"A. CONDUCT AS PARTICIPANTS IN CFA PROGRAMS","question":"Ron Vasquez is registered to sit for the CFA Level II exam. Unfortunately, Vasquez has failed the exam the past two years. In his frustration, Vasquez posted the following comment on a popular internet bulletin board: I believe that CFA Institute is intentionally limiting the number of charterholders in order to increase its cash flow by continuing to fail candidates. Just look at the pass rates. Which of the following statements regarding Vasquez’s conduct is correct? Vasquez is:","choices":{"A":"not in violation of Standard I(D), Misconduct or Standard VII(A), Conduct as Participants in the CFA Program.","B":"in violation of Standard VII(A), Conduct as Participants in the CFA Program, but not in violation of Standard I(D), Misconduct.","C":"in violation of both Standard I(D), Misconduct and Standard VII(A), Conduct as Participants in the CFA Program"},"correct":"A","solution":"37 A is correct. Standard VII(A), Conduct as Participants in the CFA Program does not prohibit expressing opinions about the program or the CFA Institute. Thus, Vasquez is not in violation. Nothing in the facts indicates a violation of Standard I(D), Misconduct. Standard I(D) deals with professional conduct involving dishonesty, fraud, or deceit."},{"id":80,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":57,"section":"B. REFERENCE TO CFA INSTITUTE, CFA DESIGNATION & CFA PROGRAM","question":"Albert and Tye, who recently started their own investment advisory business, have registered to take the Level III CFA examination. Albert’s business card reads, “Judy Albert, CFA Level II.” Tye has not put anything about the CFA designation on his business card, but promotional material that he designed for the business describes the CFA requirements and indicates that Tye participates in the CFA Program and has completed Levels I and II. According to the Standards:","choices":{"A":"Albert has violated the Standards, but Tye has not.","B":"Tye has violated the Standards, but Albert has not.","C":"Both Albert and Tye have violated the Standards."},"correct":"A","solution":"A is correct. Standard VII(B)–Reference to CFA Institute, the CFA Designation, and the CFA Program is the subject of this question. The reference on Albert’s business card implies that there is a “CFA Level II” designation; Tye merely indicates in promotional material that he is participating in the CFA Program and has completed Levels I and II. Candidates may not imply that there is some sort of partial designation earned after passing a level of the CFA exam. Therefore, Albert has violated Standard VII(B). Candidates may communicate that they are participating in the CFA Program, however, and may state the levels that they have completed. Therefore, Tye has not violated Standard VII(B)."},{"id":81,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":58,"section":"B. REFERENCE TO CFA INSTITUTE, CFA DESIGNATION & CFA PROGRAM","question":"Quinn sat for the Level III CFA exam this past weekend. He updates his resume with the following statement: “In finishing the CFA Program, I improved my skills related to researching investments and managing portfolios. I will be eligible for the CFA charter upon completion of the required work experience.”","choices":{"A":"Quinn violated the Code and Standards by claiming he improved his skills through the CFA Program.","B":"Quinn violated the Code and Standards by incorrectly stating that he is eligible for the CFA charter.","C":"Quinn did not violate the Code and Standards with his resume update."},"correct":"B","solution":"B is correct. According to Standard VII(B) – Reference to CFA Institute, the CFA Designation, and the CFA Program, Quinn cannot claim to have finished the CFA Program or be eligible for the CFA charter until he officially learns that he has passed the Level III exam. Until the results for the most recent exam are released, those who sat for the exam should continue to refer to themselves as “candidates.” Thus, answer C is incorrect. Answer A is incorrect because members and candidates may discuss areas of practice in which they believe the CFA Program improved 38 their personal skills."},{"id":82,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":59,"section":"B. REFERENCE TO CFA INSTITUTE, CFA DESIGNATION & CFA PROGRAM","question":"Rule has worked as a portfolio manager for a large investment management firm for the past 10 years. Rule earned his CFA charter last year and has decided to open his own investment management firm. After leaving his current employer, Rule creates some marketing material for his new firm. He states in the material, “In earning the CFA charter, a highly regarded credential in the investment management industry, I further enhanced the portfolio management skills learned during my professional career. While completing the examination process in three consecutive years, I consistently received the highest possible scores on the topics of Ethics, Alternative Investments, and Portfolio Management.” Has Rule violated Standard VII(B)– Reference to CFA Institute, the CFA Designation, and the CFA Program in his marketing material?","choices":{"A":"Rule violated Standard VII(B) in stating that he completed the exams in three consecutive years.","B":"Rule violated Standard VII(B) in stating that he received the highest scores in the topics of Ethics, Alternative Investments, and Portfolio Management.","C":"Rule did not violate Standard VII(B)."},"correct":"B","solution":"B is correct. According to Standard VII(B)–Reference to CFA Institute, the CFA Designation, and the CFA Program. CFA Program candidates do not receive their actual scores on the exam. Topic and subtopic results are grouped into three broad categories, and the exam is graded only as “pass” or “fail.” Although a candidate may have achieved a topical score of “above 70%,” she or he cannot factually state that she or he received the highest possible score because that information is not reported. Thus, answer C is incorrect. Answer A is incorrect as long as the member or candidate actually completed the exams consecutively. Standard VII(B) does not prohibit the communication of factual information about completing the CFA Program in three consecutive years."},{"id":83,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":60,"section":"B. REFERENCE TO CFA INSTITUTE, CFA DESIGNATION & CFA PROGRAM","question":"Jeffrey Jones passed the Level I CFA examination in 1997 and the Level II examination in 2009. He is not currently enrolled for the Level III examination. According to the CFA Institute Standards of Professional Conduct, which of the following is the most appropriate way for Jones to refer to his participation in the CFA Program?","choices":{"A":"Jeffrey Jones, CFA (expected 2014)","B":"Candidate in the CFA Institute CFA Program","C":"Passed Level II of the CFA examination in 2009"},"correct":"C","solution":"C is correct. No designation exists for someone who has passed Level I, Level II, or Level III of the CFA exam [Standard VII(B)]. Persons who have passed a certain level of the exam may state that they have completed that level. A person can only state he is a Candidate if he is currently enrolled in the CFA Program. It is also an improper reference to use “expected” a part of the designation. 39"},{"id":84,"module":4,"moduleTitle":"THE GLOBAL INVESTMENT PERFORMANCE STANDARDS (GIPS)","qnum":1,"section":"","question":"An investment management firm that does not adopt the GIPS standards could mischaracterize its overall performance by presenting a performance history:","choices":{"A":"that includes terminated portfolios.","B":"composed of a single top-performing portfolio.","C":"for an investment mandate over all periods since the firm’s inception."},"correct":"B","solution":"B is correct. Selecting a top-performing portfolio to represent a firm’s overall investment results for a specific mandate, also known as using representative accounts, is a misleading practice that is not allowed under the GIPS standards. A is incorrect because including terminated portfolios is consistent with the GIPS standards. If the firm instead presented a performance history that excludes terminated portfolios, however, such a practice would be misleading and not allowed under the GIPS standards. C is incorrect because presenting performance for its mandate covering all periods since the firm’s inception is consistent with the GIPS standards. If the firm instead presented performance for a selected period during which it produced excellent returns or outperformed its benchmark, however, such a practice would be misleading and not allowed under the GIPS standards."},{"id":85,"module":4,"moduleTitle":"THE GLOBAL INVESTMENT PERFORMANCE STANDARDS (GIPS)","qnum":2,"section":"","question":"Which of the following statements related to why the GIPS standards were created is least likely correct? GIPS standards were created to:","choices":{"A":"provide clients certainty in what is presented and allow them to make reasonable comparisons.","B":"identify a set of ethical principles for firms to follow in calculating and presenting historical investment results.","C":"establish a standardized, industry wide approach for investment firms to follow."},"correct":"A","solution":"A is correct. The GIPS standards were created to ensure fair representation and full disclosure of investment performance, not to provide certainty in what is presented. B is incorrect because this is a correct statement as to why the GIPS standards were created. C is incorrect because this is a correct statement as to why the GIPS standards were created."},{"id":86,"module":4,"moduleTitle":"THE GLOBAL INVESTMENT PERFORMANCE STANDARDS (GIPS)","qnum":3,"section":"","question":"To comply with the GIPS standards, firms most likely must:","choices":{"A":"apply standards on a firm-wide basis.","B":"be verified before they can claim compliance.","C":"be defined as separate legal entities."},"correct":"A","solution":"A is correct. According to requirements for GIPS compliance, GIPS standards must be applied 40 on a firm-wide basis. They cannot be separately applied to composites. B is incorrect because firms are responsible for their own claims of compliance. While a third-party independent verification is recommended it is not required for compliance to be claimed by a firm. C is incorrect because a firm must be defined as an investment firm, subsidiary, or division held out to clients or prospective clients as a distinct business entity. There is no requirement for the firm to be a separate legal entity."},{"id":87,"module":4,"moduleTitle":"THE GLOBAL INVESTMENT PERFORMANCE STANDARDS (GIPS)","qnum":4,"section":"","question":"Each composite of a GIPS-compliant firm must consist of:","choices":{"A":"multiple portfolios.","B":"portfolios selected on an ex-post basis.","C":"portfolios managed according to a similar investment strategy."},"correct":"C","solution":"C is correct. A composite is an aggregation of one or more portfolios managed according to a similar investment mandate, objective, or strategy. For example, if a GIPS-compliant firm presents performance for a global equity composite (the composite), the composite must include portfolios that are managed, or have historically been managed, according to the firm’s global equity strategy. A is incorrect because a composite may consist of a single portfolio when it is the only portfolio managed according to a particular mandate. B is incorrect because the determination of which portfolio(s) to include in a composite should be done according to pre\u0002established criteria (ex ante basis), not after the fact (ex post basis)."},{"id":88,"module":4,"moduleTitle":"THE GLOBAL INVESTMENT PERFORMANCE STANDARDS (GIPS)","qnum":5,"section":"","question":"Verification of a firm’s claim of compliance with the GIPS standards is performed:","choices":{"A":"by firm personnel.","B":"on a firm-wide basis.","C":"to ensure the accuracy of a specific composite presentation."},"correct":"B","solution":"B is correct. Verification is performed with respect to an entire firm, not on specific composites."},{"id":89,"module":4,"moduleTitle":"THE GLOBAL INVESTMENT PERFORMANCE STANDARDS (GIPS)","qnum":6,"section":"","question":"G&F Advisors claims compliance with the Global Investment Performance Standards (GIPS) in its marketing materials. The compliant presentation includes a footnote which indicates that the firm has been verified by an independent third party. An additional note states that G&F is in compliance with the GIPS standards except for its private equity investments. Is it likely that G&F violated the GIPS standards?","choices":{"A":"No, because the footnotes meet the requirements of the Standards.","B":"No, because the provisions do not apply to the private equity investments.","C":"Yes, because they cannot claim compliance unless all requirements of the Standard are met."},"correct":"C","solution":"C is correct. Firms must meet all the requirements set forth in the GIPS standards and cannot claim partial compliance."}];
const KEY="cfa_ethics_mobile_2026_v2";
let state={};try{state=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){state={}}
state.answers=state.answers||{};state.starred=state.starred||{};state.lastId=state.lastId||1;
let filtered=[],index=0,mistakesOnly=false,starredOnly=false;
const moduleFilter=document.getElementById("moduleFilter"),sectionFilter=document.getElementById("sectionFilter"),quiz=document.getElementById("quiz"),prevBtn=document.getElementById("prevBtn"),nextBtn=document.getElementById("nextBtn");
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function shortSection(s){return s?s.replace(/^[A-Z].s*/,""):""}
function populateModules(){moduleFilter.innerHTML='<option value="all">Tất cả module</option>';Array.from(new Set(ALL.map(q=>q.module))).forEach(function(m){const q=ALL.find(x=>x.module===m),o=document.createElement("option");o.value=String(m);o.textContent="Module "+m+" — "+q.moduleTitle;moduleFilter.appendChild(o)})}
function populateSections(){const mod=moduleFilter.value,qs=mod==="all"?ALL:ALL.filter(q=>String(q.module)===mod),secs=Array.from(new Set(qs.map(q=>q.section).filter(Boolean)));sectionFilter.innerHTML='<option value="all">Tất cả Standard / phần</option>';secs.forEach(function(s){const o=document.createElement("option");o.value=s;o.textContent=s;sectionFilter.appendChild(o)});sectionFilter.disabled=secs.length===0}
function rebuild(keep){const mod=moduleFilter.value,sec=sectionFilter.value;filtered=ALL.filter(function(q){const ans=state.answers[q.id];return(mod==="all"||String(q.module)===mod)&&(sec==="all"||q.section===sec)&&(!mistakesOnly||(ans&&ans!==q.correct))&&(!starredOnly||state.starred[q.id])});if(!keep){const found=filtered.findIndex(q=>q.id===state.lastId);index=found>=0?found:0}if(index>=filtered.length)index=Math.max(0,filtered.length-1);render()}
function counts(){const answered=filtered.filter(q=>state.answers[q.id]).length,correct=filtered.filter(q=>state.answers[q.id]===q.correct).length;return{answered,correct}}
function renderStats(){const c=counts();document.getElementById("counter").textContent=filtered.length?(index+1)+" / "+filtered.length:"0 / 0";document.getElementById("accuracy").textContent=c.answered?Math.round(c.correct/c.answered*100)+"%":"0%";document.getElementById("remaining").textContent=String(filtered.length-c.answered);document.getElementById("bar").style.width=filtered.length?(c.answered/filtered.length*100)+"%":"0%"}
function render(){renderStats();if(!filtered.length){quiz.innerHTML='<div class="empty">Không có câu nào khớp bộ lọc này.</div>';prevBtn.disabled=true;nextBtn.disabled=true;return}const q=filtered[index],picked=state.answers[q.id]||"",answered=!!picked,star=!!state.starred[q.id];state.lastId=q.id;save();let choices="";["A","B","C"].forEach(function(letter){let cls="choice";if(picked===letter)cls+=" selected";if(answered&&letter===q.correct)cls+=" correct";if(answered&&picked===letter&&letter!==q.correct)cls+=" wrong";choices+='<button class="'+cls+'" data-letter="'+letter+'" '+(answered?"disabled":"")+'><span class="letter">'+letter+'</span><span>'+esc(q.choices[letter])+'</span></button>'});const good=answered&&picked===q.correct,fcls=answered?(good?"good":"bad"):"",ftitle=answered?(good?"✓ Đúng":"✗ Sai — đáp án đúng: "+q.correct):"";quiz.innerHTML='<section class="card"><div class="meta"><span class="tag">Module '+q.module+'</span><span class="tag">Q'+q.qnum+'</span>'+(q.section?'<span class="tag">'+esc(shortSection(q.section))+'</span>':"")+'<button class="star" id="starBtn" aria-label="Mark for review">'+(star?"★":"☆")+'</button></div><div class="q">'+esc(q.question)+'</div>'+choices+'<div class="feedback '+fcls+'"><strong>'+ftitle+'</strong><div class="expl">'+(answered?esc(q.solution):"")+'</div></div><div class="smallNote">Chọn đáp án để xem lời giải • tiến độ tự lưu trên iPhone</div></section>';document.querySelectorAll(".choice").forEach(function(btn){btn.addEventListener("click",function(){state.answers[q.id]=btn.dataset.letter;save();render();window.scrollTo({top:0,behavior:"smooth"})})});document.getElementById("starBtn").onclick=function(){state.starred[q.id]=!state.starred[q.id];save();render()};prevBtn.disabled=index===0;nextBtn.disabled=false;nextBtn.textContent=index===filtered.length-1?"Xong ✓":"Tiếp →"}
function go(delta){if(!filtered.length)return;if(delta>0&&index===filtered.length-1){const c=counts();alert("Hoàn thành bộ này. Accuracy: "+(c.answered?Math.round(c.correct/c.answered*100):0)+"%");return}const ni=Math.min(filtered.length-1,Math.max(0,index+delta));if(ni!==index){index=ni;render();window.scrollTo({top:0,behavior:"smooth"})}}
populateModules();populateSections();rebuild(false);
moduleFilter.onchange=function(){populateSections();rebuild(false)};sectionFilter.onchange=function(){rebuild(false)};prevBtn.onclick=function(){go(-1)};nextBtn.onclick=function(){go(1)};
document.getElementById("shuffleBtn").onclick=function(){for(let i=filtered.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)),t=filtered[i];filtered[i]=filtered[j];filtered[j]=t}index=0;render();document.getElementById("filtersBox").open=false};
document.getElementById("mistakesBtn").onclick=function(){mistakesOnly=!mistakesOnly;this.classList.toggle("on",mistakesOnly);rebuild(false)};
document.getElementById("starredBtn").onclick=function(){starredOnly=!starredOnly;this.classList.toggle("on",starredOnly);rebuild(false)};
document.getElementById("clearFilterBtn").onclick=function(){mistakesOnly=false;starredOnly=false;moduleFilter.value="all";populateSections();sectionFilter.value="all";document.getElementById("mistakesBtn").classList.remove("on");document.getElementById("starredBtn").classList.remove("on");rebuild(false)};
document.getElementById("resetBtn").onclick=function(){if(confirm("Xóa toàn bộ đáp án và dấu ★ đã lưu?")){state={answers:{},starred:{},lastId:1};save();rebuild(false)}};
let sx=0,sy=0;document.addEventListener("touchstart",function(e){if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});document.addEventListener("touchend",function(e){const t=e.changedTouches&&e.changedTouches[0];if(!t)return;const dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>75&&Math.abs(dx)>Math.abs(dy)*1.4){if(dx<0)go(1);else go(-1)}},{passive:true});
