.stats{display:grid;grid-template-columns:1.15fr .9fr .9fr;gap:7px;margin-top:9px}.stat{background:#fff;border:1px solid var(--line);border-radius:11px;padding:7px 8px;text-align:center;min-width:0}.stat b{font-size:13px;display:block;white-space:nowrap}.stat span{font-size:10px;color:var(--muted);display:block;margin-top:1px}
.filters{margin:10px 0 12px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.filters summary{list-style:none;padding:12px 13px;font-weight:750;font-size:14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}.filters summary::-webkit-details-marker{display:none}.filtersInner{padding:0 12px 12px;display:grid;gap:9px}
select{width:100%;min-height:46px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:0 12px;font-size:16px;color:var(--text)}
.toolRow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tool{min-height:44px;border:1px solid var(--line);background:#fff;border-radius:11px;font-weight:700;color:#344054}.tool.on{background:var(--accentSoft);border-color:#a8b9fb;color:#153eaa}

.meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-bottom:12px}.tag{background:#f2f4f7;border-radius:999px;padding:5px 8px;color:#475467}.star{margin-left:auto;border:0;background:transparent;font-size:24px;line-height:1;padding:2px 3px;color:#f59e0b}
.q{font-size:18px;line-height:1.47;font-weight:760;letter-spacing:-.008em;margin:0 0 15px;overflow-wrap:anywhere}
.choice{width:100%;min-height:58px;margin:9px 0;padding:12px 13px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--text);display:flex;align-items:flex-start;gap:11px;text-align:left;font-size:16px;line-height:1.4}.choice:active{transform:scale(.995)}.choice .letter{flex:0 0 31px;height:31px;border-radius:50%;background:#f2f4f7;display:grid;place-items:center;font-size:14px;font-weight:800;margin-top:1px}
.choice.selected{border-color:var(--accent);background:var(--accentSoft)}.choice.correct{border-color:#75d4aa;background:var(--goodBg)}.choice.correct .letter{background:#d1fadf;color:var(--good)}.choice.wrong{border-color:#f3aaa5;background:var(--badBg)}.choice.wrong .letter{background:#fee4e2;color:var(--bad)}.choice:disabled{opacity:1;color:inherit}
.feedback{display:none;margin-top:14px;padding:13px;border-radius:13px;font-size:15px;line-height:1.48}.feedback.good{display:block;background:var(--goodBg);border:1px solid #abefc6}.feedback.bad{display:block;background:var(--badBg);border:1px solid #fecdca}.expl{margin-top:7px;color:#344054;overflow-wrap:anywhere}
.smallNote{font-size:11px;color:var(--muted);text-align:center;margin-top:12px}.empty{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px 18px;text-align:center;color:var(--muted)}
.bottom{position:fixed;z-index:50;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:9px 14px calc(env(safe-area-inset-bottom) + 9px)}
.bottomInner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1.35fr;gap:9px}.navBtn{min-height:51px;border-radius:14px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:16px;color:#344054}.navBtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.navBtn:disabled{opacity:.4}
@media(min-width:600px){.app{padding-left:20px;padding-right:20px}.card{padding:22px}.q{font-size:20px}}

<script>
const ALL=[{"id":1,"module":1,"moduleTitle":"ETHICS AND TRUST IN THE INVESTMENT PROFESSION","qnum":1,"section":"","question":"How does ethical conduct most likely compare with what is legally required?","choices":{"A":"Ethical conduct goes beyond what is legally required.","B":"There are no differences between the two; they are the same.","C":"Doing what is legally required removes the need for ethical conduct."},"correct":"A","solution":"A is correct. Ethical conduct goes beyond what is legally required and encompasses what most societies, communities, and professional organizations consider to be ethically correct behavior. Good ethical judgement requires considering the interests of a multiple of stakeholders while minimizing their risks."},{"id":2,"module":1,"moduleTitle":"ETHICS AND TRUST IN THE INVESTMENT PROFESSION","qnum":2,"section":"","question":"Which of the following statements is most accurate? Ethics can be described as:","choices":{"A":"a commitment to upholding the law.","B":"an individual’s personal opinion about right and wrong.","C":"a set of moral principles that provide guidance for our behavior."},"correct":"C","solution":"C is correct. Ethics can be described as a set of moral principles that provide guidance for our behavior; these may be moral principles shared by a community or societal group."},{"id":3,"module":1,"moduleTitle":"ETHICS AND TRUST IN THE INVESTMENT PROFESSION","qnum":3,"section":"","question":"Which of the following statements is most accurate? Investment professionals have a special responsibility to act ethically because:","choices":{"A":"the industry is heavily regulated.","B":"they are entrusted to protect clients’ assets.","C":"the profession requires compliance with its code of ethics."},"correct":"B","solution":"B is correct. Investment professionals have a special responsibility because clients entrust them to protect the clients’ assets."},{"id":4,"module":1,"moduleTitle":"ETHICS AND TRUST IN THE INVESTMENT PROFESSION","qnum":4,"section":"","question":"Which of the following statements best completes the following sentence? Professionals use their specialized knowledge and skills:","choices":{"A":"in service to others.","B":"to advance their career.","C":"for the exclusive benefit of their employers."},"correct":"A","solution":"A is correct. Professionals use specialized knowledge and skills in service to others. Their career and employer may benefit, but those results are not the primary focus of a professional’s use of his or her specialized knowledge and skills.4"},{"id":5,"module":1,"moduleTitle":"ETHICS AND TRUST IN THE INVESTMENT PROFESSION","qnum":5,"section":"","question":"A profession is most likely described as a group of people that:","choices":{"A":"has a common level of basic knowledge about a particular subject.","B":"monitors its members based on an agreed-on code of ethics.","C":"puts the interests of its members first."},"correct":"B","solution":"B is correct. A profession is practiced by members who share and agree to adhere to a common code of ethics, and a profession is based on a specialized knowledge and skills and service to others. A is incorrect because a profession is based on a specialized knowledge and skills, not basic knowledge. C is incorrect because a profession is based on service to others that may not necessarily mean the interests of its members come first."},{"id":6,"module":1,"moduleTitle":"ETHICS AND TRUST IN THE INVESTMENT PROFESSION","qnum":6,"section":"","question":"An investment fund manager has a finance degree and over 20 years of experience working for a top-ranking asset management firm. Based only on this information, could the investment fund manager most likely claim to be part of a profession?","choices":{"A":"Yes, a person working in this industry requires specialized knowledge and skills.","B":"No.","C":"Yes, as part of the industry, he is providing a service to others."},"correct":"B","solution":"B is correct. For the investment fund manager to claim he is part of a profession, the activity must be based on specialized knowledge and skills, must include service to others, and must be practiced by members who share and agree to adhere to a common code of ethics. Investment management is based on providing service to a firm’s clients and also requires specialized knowledge and skills, but it would not be considered a profession unless there exists a common code of ethics among similar investment fund managers."},{"id":7,"module":1,"moduleTitle":"ETHICS AND TRUST IN THE INVESTMENT PROFESSION","qnum":7,"section":"","question":"Which of the following will most likely determine whether an individual will behave unethically?","choices":{"A":"The person’s character","B":"The person’s internal traits and intrinsic motivation","C":"External factors, such as environmental or cultural elements"},"correct":"C","solution":"C is correct. Social psychologists have shown that even good people may behave unethically in difficult situations. Situational influences, which are external factors (e.g., environmental or cultural elements), can shape our thinking, decision making, and behavior and are more likely to lead to unethical behavior than internal traits or character."},{"id":8,"module":1,"moduleTitle":"ETHICS AND TRUST IN THE INVESTMENT PROFESSION","qnum":8,"section":"","question":"Which of the following statements is most accurate?","choices":{"A":"Large financial rewards, such as bonuses, are the most powerful situational influences.5","B":"When decision making focuses on short-term factors, the likelihood of ethical conduct increases.","C":"Situational influences can motivate individuals to act in their short-term self-interests without recognizing the long-term risks or consequences for themselves and others."},"correct":"C","solution":"C is correct. Situational influences can motivate individuals to act in their short-term self\u0002interests without recognizing the long-term risks or consequences for themselves and others. Large financial rewards are powerful situational influences, but in some situations, other situational influences, such as loyalty to colleagues, may be even more powerful."},{"id":9,"module":1,"moduleTitle":"ETHICS AND TRUST IN THE INVESTMENT PROFESSION","qnum":9,"section":"","question":"Situational influences in decision making will most likely be minimized if:","choices":{"A":"strong compliance programs are in place.","B":"longer-term consequences are considered.","C":"individuals believe they are truthful and honest."},"correct":"B","solution":"B is correct. Consciously considering long-term consequences will help offset situational influences. We more easily recognize and consider short-term situational influences than longer\u0002term considerations because longer-term considerations have fewer immediate consequences than situational influences do. When decision making is too narrowly focused on short-term factors, we tend to ignore longer-term risks and consequences, and the likelihood of poor ethical decision\u0002making increases. A strong compliance policy is a good first step toward developing an ethical culture; a focus on rules adherence may not be sufficient. Emphasis on compliance may not encourage decision makers to consider the larger picture and can oversimplify decision making. Taken to the extreme, a strong compliance culture can become another situational influence that blinds employees to other important considerations. An overconfidence bias can place too much importance on internal traits and intrinsic motivations, such as “I’m honest and would not lie,” even though studies have shown that internal traits are generally not the main determinant of whether or not someone will behave ethically in a given situation."},{"id":10,"module":1,"moduleTitle":"ETHICS AND TRUST IN THE INVESTMENT PROFESSION","qnum":10,"section":"","question":"An ethical decision-making framework will most likely:","choices":{"A":"include a pre-determined, uniform sequence.","B":"focus exclusively on confirmable facts and relationships.","C":"help avoid a decision that has unanticipated ethical consequences."},"correct":"C","solution":"C is correct. Using an ethical decision-making framework consistently will help you develop sound judgment and decision-making skills and avoid making decisions that have unanticipated ethical consequences. The decision-making process is often iterative, and the decision maker may move between phases of the framework. A decision maker should consider more than confirmable facts and relationships; for example, the decision maker should consider situational influences and personal biases.6"},{"id":11,"module":1,"moduleTitle":"ETHICS AND TRUST IN THE INVESTMENT PROFESSION","qnum":11,"section":"","question":"A research analyst is facing a moral dilemma and decides to use an ethical decision-making framework. After looking at the facts at hand and identifying the situational influences, he still cannot make a decision on the best course of action. His least appropriate next step is to:","choices":{"A":"determine what additional information is needed.","B":"decide, act, monitor, and reflect.","C":"ask someone else to give guidance."},"correct":"B","solution":"B is correct. The least appropriate action would be for the decision maker to go ahead and make a decision based on insufficient information. By doing so, the decision maker could cause harm and make the situation worse. The ethical decision-making framework is iterative, and users can move between phases rather than undertaking them in any one order. If a decision maker is not yet ready to make a decision, the most appropriate course of action would be to ask someone else to give guidance and determine what additional information is needed to clarify the situation."},{"id":12,"module":1,"moduleTitle":"ETHICS AND TRUST IN THE INVESTMENT PROFESSION","qnum":12,"section":"","question":"Examples of the beneficial features of using an ethical decision-making framework least likely includes analyzing:","choices":{"A":"the best course of action when alternatives are available.","B":"the decision maker’s perspective of contemplated actions.","C":"a broader picture from a long-term point of view."},"correct":"B","solution":"B is correct. An ethical decision-making framework helps a decision maker see the situation from multiple perspectives, not just from her personal perspective, and pay attention to aspects of the situation that may be less evident if a short-term, self-focused perspective is applied."},{"id":13,"module":1,"moduleTitle":"ETHICS AND TRUST IN THE INVESTMENT PROFESSION","qnum":13,"section":"","question":"If you are characterizing clients, family, colleagues, and market participants and the duties owed to them, you are most likely in which phase of an ethical decision-making framework?","choices":{"A":"Decide","B":"Identify","C":"Consider"},"correct":"B","solution":"B is correct. The Identify phase is typically the initial phase of the ethical decision-making framework. In this phase, you will identify the important facts available as well as those facts that you wish were available to develop a complete understanding of the situation. In this phase you also identify the stakeholders—clients, family, colleagues, market participants, and others—and the duties to them.7"},{"id":14,"module":2,"moduleTitle":"CODE OF ETHICS AND STANDARDS OF PROFESSIONAL CONDUCT","qnum":1,"section":"","question":"Which of the following least likely forms the basic structure for enforcement of the CFA Institute Professional Conduct Program?","choices":{"A":"Bylaws","B":"Rules of Procedure","C":"Board of Governors"},"correct":"C","solution":"C is correct. Although the Board of Governors maintains oversight and responsibility for the Professional Conduct Program, the CFA Institute Bylaws and Rules of Procedure form the basic structure for enforcement of the Code and Standards."},{"id":15,"module":2,"moduleTitle":"CODE OF ETHICS AND STANDARDS OF PROFESSIONAL CONDUCT","qnum":2,"section":"","question":"With respect to the professional conduct of a member or candidate, CFA Institute staff will consider a complaint from:","choices":{"A":"anyone.","B":"only other members and candidates or professionals in the investment industry.","C":"only other members and candidates."},"correct":"A","solution":"A is correct. Complaints to the Professional Conduct Program may be filed by anyone."},{"id":16,"module":2,"moduleTitle":"CODE OF ETHICS AND STANDARDS OF PROFESSIONAL CONDUCT","qnum":3,"section":"","question":"Who most likely determines whether a violation of the CFA Institute Code and Standards or testing policies has occurred and what sanction should be imposed? The:","choices":{"A":"Professional Conduct Staff and the Disciplinary Review Committee","B":"Professional Conduct Staff","C":"Disciplinary Review Committee"},"correct":"A","solution":"A is correct. Both the Professional Conduct Staff and the Disciplinary Review Committee are responsible for determining whether a violation of the Code and Standards or testing policies has occurred and if so, what sanction should be imposed. Following their investigation, the Professional Conduct Staff may conclude the inquiry with no disciplinary sanction, issue a cautionary letter, or continue proceedings to discipline the member or candidate which include the charges and a proposed sanction. If that proposal is rejected by the member or candidate, the matter is referred to a panel composed of DRC Members. The panel’s task is to determine whether a violation of the Code and Standards or testing policies occurred and if so what sanction should be imposed."},{"id":17,"module":2,"moduleTitle":"CODE OF ETHICS AND STANDARDS OF PROFESSIONAL CONDUCT","qnum":4,"section":"","question":"Holly Baker, CFA is explaining the CFA Institute Code of Ethics to a client. Which of the following statements could Baker make to most likely reflect disciplinary sanctions the CFA 8 Institute may impose? Sanctions include:","choices":{"A":"fines for violations.","B":"revocation of membership.","C":"banishment from the industry."},"correct":"B","solution":"B is correct. CFA Institute may revoke membership for violations of the Institute Code of Ethics. A is incorrect because CFA Institute Bylaws do not include fines as a sanction. C is incorrect as CFA Institute does not have the authority to ban an individual from the business and does not always apply sanctions to every violation of its Code."},{"id":18,"module":2,"moduleTitle":"CODE OF ETHICS AND STANDARDS OF PROFESSIONAL CONDUCT","qnum":5,"section":"","question":"Tibor Figeczky, CFA, is an equity trader at Global Investment Bank (GB). Figeczky traded the bank’s investment portfolio profitably for the past three years and earned significant bonuses for his efforts. Subsequently, internal auditors of GB formally accused Figeczky of exceeding his trading authority and engaging in unauthorized trades. According to the CFA Institute Code of Ethics and Standards of Professional Conduct, Figeczky should most likely:","choices":{"A":"disclose the complaint to CFA Institute.","B":"refuse further bonuses until the issue is resolved.","C":"request a temporary suspension of his CFA Institute membership."},"correct":"A","solution":"A is correct. as members and candidates must self-disclose on the annual Professional Conduct Statement all matters that question their professional conduct, such as involvement in civil litigation or a criminal investigation or being the subject of a written complaint. B is incorrect as the Code and Standards do not prohibit a member from accepting a bonus while an investigation into his professional behavior is conducted. In this case, the member’s actions have been questioned but he has not yet had an opportunity to defend his behavior and may in fact have acted within his authority and earned the compensation fairly. C is incorrect as the Code does not require a member to request a suspension of their membership while a complaint is being investigated."},{"id":19,"module":2,"moduleTitle":"CODE OF ETHICS AND STANDARDS OF PROFESSIONAL CONDUCT","qnum":6,"section":"","question":"Disclosure of confidential CFA exam information will most likely be detected by the Professional Conduct staff through:","choices":{"A":"monitoring online and social media.","B":"analysis of Proctor Reports.","C":"annual Professional Conduct Statements."},"correct":"A","solution":"A is correct. Professional Conduct inquiries come from a number of sources including the monitoring of online and social media to detect disclosure of confidential exam information. B is incorrect because candidate conduct is monitored by exam proctors who complete reports on candidates suspected to have violated testing rules during the exam and at the exam center. C is incorrect because members and candidates must self-disclose on the annual Professional 9 Conduct Statement all matters that question their professional conduct, such as involvement in civil litigation or a criminal investigation or being the subject of a written complaint. Disclosure of confidential exam information will not be found on the annual statement."},{"id":20,"module":2,"moduleTitle":"CODE OF ETHICS AND STANDARDS OF PROFESSIONAL CONDUCT","qnum":7,"section":"","question":"The CFA Institute Professional Conduct Program may impose sanctions on:","choices":{"A":"CFA charterholders and candidates for the CFA designation.","B":"CFA charterholders only.","C":"CFA charterholders, member firms, and candidates for the CFA designation."},"correct":"A","solution":"A is correct. The CFA Institute Professional Conduct Program may impose sanctions on CFA charterholders and candidates for the CFA designation. Firms are not members of CFA Institute."},{"id":21,"module":2,"moduleTitle":"CODE OF ETHICS AND STANDARDS OF PROFESSIONAL CONDUCT","qnum":8,"section":"","question":"According to the Code of Ethics, members of CFA Institute and candidates for the CFA designation must:","choices":{"A":"maintain their professional competence to exercise independent professional judgment.","B":"place the integrity of the investment profession and the interests of clients above their own personal interests.","C":"practice in a professional and ethical manner with the public, clients, and others in the global capital markets."},"correct":"B","solution":"B is correct. Members of CFA Institute and candidates for the CFA designation must place the integrity of the investment profession and the interests of clients above their own personal interests. A is incorrect because members of CFA Institute and candidates for the CFA designation must maintain and improve their professional competence and strive to maintain and improve the competence of other investment professionals. The exercise of independent professional judgment is associated with using reasonable care. C is incorrect because members of CFA Institute and candidates for the CFA designation must practice and encourage others to practice in a professional and ethical manner that will reflect credibly on themselves and the profession. Members are supposed to act with integrity, competence, diligence, and respect and in an ethical manner with the public, clients, and other market participants."},{"id":22,"module":2,"moduleTitle":"CODE OF ETHICS AND STANDARDS OF PROFESSIONAL CONDUCT","qnum":9,"section":"","question":"Which of the following statements is most likely consistent with the CFA Institute Code of Ethics? CFA Institute members and CFA candidates must:","choices":{"A":"promote the integrity and viability of the global capital markets for the ultimate benefit of society.","B":"practice the highest level of personal and professional integrity and always act in the best interest of their employers.","C":"maintain their professional competence and require investment professionals under their supervision to adopt the CFA Code of Ethics."},"correct":"A","solution":"10 A is correct. The Code of Ethics requires CFA members and candidates to promote the integrity and viability of the global capital markets for the ultimate benefit of society. While the Code of Ethics requires members and candidates to act with integrity, and the interests of the client are paramount, not all requests of clients are appropriate to follow, particularly if considered unethical or illegal. The Code of Ethics does not require members and candidates to encourage others to pursue the CFA designation, but to improve their professional competence. B is incorrect because there are times when acting in the best interests of an employer may conflict with the Code and Standards or in the best interests of clients C is incorrect because there is no such requirement for supervisors."},{"id":23,"module":2,"moduleTitle":"CODE OF ETHICS AND STANDARDS OF PROFESSIONAL CONDUCT","qnum":10,"section":"","question":"The goals of the CFA Institute Code of Ethics would least likely include:","choices":{"A":"publicly communicating established principles.","B":"addressing past ethical failings.","C":"fostering public confidence."},"correct":"B","solution":"B is correct. Addressing past ethical failings is not a goal of the CFA Institute Code of Ethics. Fostering public confidence and publicly communicating established principles are both goals of the CFA Institute Code of Ethics. A is incorrect because a goal of the CFA Institute Code of Ethics would include publicly communicating established principles. C is incorrect because a goal of the CFA Institute Code of Ethics would include fostering public confidence.11"},{"id":24,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":1,"section":"A. KNOWLEDGE OF THE LAW","question":"Janet Green, CFA, provides investment advice and other services to clients in several countries. She resides in Country A whose securities laws and regulations are less strict than the Code and Standards. She also conducts business with clients in Country B, which has no securities laws or regulations, and in Country C, which has securities laws and regulations that are stricter than the Code and Standards. Which of the following statements is correct? According to CFA Institute Standards of Professional Conduct, Green must adhere to the Code and Standards in:","choices":{"A":"Country A and Country B but the law in Country C.","B":"Country A but the law in Country B and Country C.","C":"Country A, Country B, and Country C."},"correct":"A","solution":"A is correct. Green needs to follow Standard I(A) - Knowledge of the law. In Country A, Green must adhere to the Code and Standards because Country A's laws are less strict. In Country B, Green must also adhere to the Code and Standards because Country B has no securities laws. Because Country C's applicable law is stricter than the requirements of the Code and Standards, Green must adhere to the laws of Country C."},{"id":25,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":2,"section":"A. KNOWLEDGE OF THE LAW","question":"James Woods, CFA, is a Portfolio Manager at ABC Securities. Woods has reasonable grounds to believe his colleague, Sandra Clarke, a CFA Level II Candidate, is engaged in unethical trading activities that may also be in violation of local securities laws. Woods is not Clarke’s supervisor, and her activities do not impact Woods or any of the portfolios for which he is responsible. Based on the Code and Standards, the recommended course of action is for Woods to:","choices":{"A":"not take any action because he is not directly involved.","B":"report Sandra Clarke to ABC’s trading supervisor or compliance department.","C":"report Sandra Clarke to the appropriate governmental or regulatory organization."},"correct":"B","solution":"B is correct. Under Standard I(A) in situations where a member or candidate is aware of employer engagement in unethical or illegal activity, it is recommended that they attempt to stop the behavior by bringing it to the attention through a supervisor or the firm’s compliance department."},{"id":26,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":3,"section":"B. INDEPENDENCE & OBJECTIVITY","question":"Robert Miguel, CFA, is a portfolio manager. On Saturday, one of his clients invited Miguel and his wife to be his guests at his luxury suite for a major league baseball playoff game, which they did. Miguel told his supervisor on Monday that they had attended the game with the client and that the 12 suite was luxurious. Miguel has:","choices":{"A":"not violated the Standards.","B":"violated the Standards because disclosure must be in writing.","C":"violated the Standards because he must disclose the gift prior to accepting."},"correct":"A","solution":"A is correct. A is correct. In this case, Miguel has not violated the standards. For a gift from a client in appreciation of past service or performance, informing his supervisor verbally is sufficient. Standard I(B) Independence and Objectivity requires disclosure prior to accepting the gift \"when possible,\" but in cases such as this when there is short notice, notification afterward is permitted."},{"id":27,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":4,"section":"B. INDEPENDENCE & OBJECTIVITY","question":"An investment banking department of a brokerage firm often receives material nonpublic information that could have considerable value if used in advising the firm’s brokerage clients. In order to conform to the Code and Standards, which one of the following is the best policy for the brokerage firm?","choices":{"A":"Permanently prohibit both “buy” and “sell” recommendations of the stocks of clients of the investment banking department.","B":"Establish physical and informational barriers within the firm to prevent the exchange of information between the investment banking and brokerage operations.","C":"Monitor the exchange of information between the investment banking department and the brokerage operation."},"correct":"B","solution":"B is correct. The best policy to prevent violation of Standard II(A) – Material Nonpublic Information and Standard I(B) – Independence and Objectivity is the establishment of firewalls in a firm to prevent exchange of insider information. The physical and informational barrier of a firewall between the investment banking department and the brokerage operation prevents the investment banking department from providing information to analysts on the brokerage side who may be writing recommendations on a company stock. Prohibiting recommendations of the stock of companies that are clients of the investment banking department is an alternative, but answer A states that this prohibition would be permanent, which is not the best answer. Once an offering is complete and the material nonpublic information obtained by the investment banking department becomes public, resuming publishing recommendations on the stock is not a violation of the Code and Standards because the information of the investment banking department no longer gives the brokerage operation an advantage in writing the report. Answer C is incorrect because no exchange of information should be occurring between the investment banking department and the brokerage operation, so monitoring of such exchanges is not an effective compliance procedure for preventing the use of material nonpublic information."},{"id":28,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":5,"section":"B. INDEPENDENCE & OBJECTIVITY","question":"Luis Rodriguez, CFA, is an analyst at XYZ Investments. He covers a company that is located in a region that is not easily accessible. The company invites analysts for their annual analyst meeting and pays for the transportation to the remote location. Rodriguez is:13","choices":{"A":"allowed to accept the payment for transportation as long as it does not exceed $100.","B":"allowed to accept the payment for transportation because the trip was all business and was out of the way.","C":"not allowed to accept the payment for transportation because this may influence his independent judgment."},"correct":"B","solution":"B is correct. Standard I(B) Independence and Objectivity. Analysts should pay for their own travel accommodations if the location is accessible by normal means. In this situation payment is acceptable because the location is out of the way and the purpose of the trip is all business."},{"id":29,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":6,"section":"B. INDEPENDENCE & OBJECTIVITY","question":"An investment management firm has been hired by ETV Corporation to work on an additional public offering for the company. The firm’s brokerage unit now has a “sell” recommendation on ETV, but the head of the investment banking department has asked the head of the brokerage unit to change the recommendation from “sell” to “buy.” According to the Standards, the head of the brokerage unit would be permitted to:","choices":{"A":"Increase the recommendation by no more than one increment (in this case, to a “hold” recommendation).","B":"Place the company on a restricted list and give only factual information about the company.","C":"Assign a new analyst to decide if the stock deserves a higher rating."},"correct":"B","solution":"B is correct. This question relates to Standard I(B)–Independence and Objectivity. When asked to change a recommendation on a company stock to gain business for the firm, the head of the brokerage unit must refuse in order to maintain his independence and objectivity in making recommendations. He must not yield to pressure by the firm’s investment banking department. To avoid the appearance of a conflict of interest, the firm should discontinue issuing recommendations about the company. Answer A is incorrect; changing the recommendation in any manner that is contrary to the analyst’s opinion violates the duty to maintain independence and objectivity. Answer C is incorrect because merely assigning a new analyst to decide whether the stock deserves a higher rating will not address the conflict of interest."},{"id":30,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":7,"section":"C. MISREPRESENTATION","question":"Belen Zapata, CFA, is the owner of Kawah Investments. Kawah promises investors returns of up to 12% per year and claims to achieve this by investing in non-investment-grade bonds and other fixed-income instruments. Over the next 12 months, bond market yields reach unprecedented lows, and Zapata finds it impossible to achieve the returns she expected. No investments are ever made by Kawah, and clients are completely paid back all of their original investment. Zapata most likely violated the CFA Institute Standards of Professional Conduct because of the:","choices":{"A":"return of capital to clients.","B":"promised returns.14","C":"investment mandate."},"correct":"B","solution":"B is correct. The member has misrepresented the returns she could realistically achieve for her clients, violating Standard I(C), which prohibits members and candidates from guaranteeing clients any specific return on volatile investments. A is incorrect because the member has returned investor capital, which is not a violation of the Code and Standards. With the return of their capital, investors did not lose their original investment, but they did suffer an economic opportunity loss. C is incorrect because the investment mandate is not a violation of the Code and Standards. The mandate is very broadly defined and while it may or may not be appropriate, there is not enough information in the vignette to make this determination."},{"id":31,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":8,"section":"C. MISREPRESENTATION","question":"Which of the following is most likely permitted under Standard I(C), Misrepresentation?","choices":{"A":"Citing quotes attributed to \"investment experts\" without specific reference.","B":"Including data showing the current government bond yield curve in a report to a client without stating its source.","C":"Using excerpts from reports prepared by others without acknowledgement."},"correct":"B","solution":"B is correct. The government bond yield curve is factual information that is available from many recognized financial or statistical reporting services.."},{"id":32,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":9,"section":"D. MISCONDUCT","question":"Doug Watson, CFA, serves in a sales position at Sommerset Brokerage, a registered investment adviser. As part of his employment, he is excited to entertain clients. Frequently at these client outings, Watson drinks excessively. On the occasion, after dropping off a client, Watson was cited by local police for misdemeanor public intoxication. According to the Standards on Knowledge of the law and the Standard on Misconduct, Watson is in violation of:","choices":{"A":"Both of these Standards","B":"Neither of these Standards","C":"Only one of these Standards"},"correct":"B","solution":"B is correct. Watson's excessive drinking is unfortunate, but we have no evidence that it has affected his work, professional integrity, judgment, or reputation. If he commits an act involving fraud or dishonesty, he would violate the Standard on misconduct."},{"id":33,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":10,"section":"D. MISCONDUCT","question":"Albert Nyakenda, CFA, was driving to a client’s office where he was expected to close a multi\u0002million-dollar deal when he was pulled over by a traffic policeman although he did not believe he had violated any traffic laws. When Nyakenda realized the policeman planned to wrongly ticket him for speeding, he offered to buy him “lunch” so that he could quickly get to his client’s office. The 15 lunch would cost significantly more than the ticket. Did Nyakenda most likely violate the CFA Code of Ethics or Standards of Professional Conduct?","choices":{"A":"Yes.","B":"No, because he was wrongly accused.","C":"No, because the cost of lunch is more than the ticket."},"correct":"A","solution":"A is correct. Nyakenda was effectively trying to bribe the policeman so that he would not issue a speeding ticket. This action violates the Code of Ethics and Standard I(D) - Misconduct. Despite feeling he was wrongly accused, it is only his opinion, and may not be based on fact or in a court of law. Nyakenda has a responsibility to act with integrity and in an ethical as required by the Code of Ethics. B is incorrect because Nyakenda does not have the authority to determine whether he was wrongly accused. That is his opinion, not based on fact or in a court of law. He must obey the laws of the country within which he resides and works and act with integrity and in an ethical manner. C is incorrect because he must obey the laws of the country within which he resides and works and does not have the jurisdictional power to determine whether his “punishment” is just. Nyakenda must act with integrity and in an ethical manner."},{"id":34,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":11,"section":"D. MISCONDUCT","question":"Nicholas Bennett, CFA, is a trader at a stock exchange. Another trader approached Bennett on the floor of the exchange and verbally harassed him about a poorly executed trade. In response, Bennett pushed the trader and knocked him to the ground. After investigating the incident, the exchange cleared Bennett from any wrongdoing. Which of the following best describes Bennett’s conduct in relation to the CFA Institute Code of Ethics or Standards of Professional Conduct? Bennett:","choices":{"A":"did not violate any Code or Standard.","B":"violated the Professional Misconduct Standard.","C":"violated both Misconduct and Integrity of Capital Markets Standards."},"correct":"B","solution":"B is correct. The CFA Institute Code of Ethics requires members to act with integrity, competence, diligence, respect, and in an ethical and professional manner; the Standards of Professional Conduct relating to Professional Misconduct state members and candidates must not commit any act reflecting adversely on their professional reputation, integrity, or competence. Bennett’s actions violated the Code of Ethics and the Standard relating to Professionalism but not the Standard relating to Integrity of Capital Markets."},{"id":35,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":12,"section":"E. COMPETENCE","question":"Mahajan, CFA, is a successful research analyst for a large, global investment firm, working as part of a research team covering the renewable energy sector. To further his career, Mahajan applies for a new position and is hired by a boutique investment research firm focusing on ESG factors and 16 ratings. As part of the new position, Mahajan will be supervising a team of several junior analysts. Although he worked with other analysts at his prior positions, he has not previously had supervisory responsibility. His team’s remit includes the renewable energy sector, as well as transportation and construction. To prepare for his new job, Mahajan enrolls in the CFA Institute Certificate in ESG Investing program, attends several webinars focusing on environmentally friendly practices in the construction industry, engages in extensive outside reading on developments in electric transportation, and joins a trade organization for ESG-focused analysts. With regard to meeting his responsibilities to comply with the Code and Standards, Mahajan’s actions:","choices":{"A":"are sufficient to comply with all his responsibilities under the Code and Standards.","B":"fail to meet the requirements of the Code and Standards because he is not enrolled in a formal continuing education program.","C":"fail to meet the requirements of the Code and Standards because he has not undertaken activities to obtain the skills and knowledge needed for fulfilling his new role as supervisor."},"correct":"C","solution":"C is correct. This case relates to Standard I(E) Competence, which requires members and candidates to act with and maintain the competence necessary to fulfill their professional responsibilities. Mahajan’s professional responsibilities changed when he took the new position that requires competence in other skills, abilities, and knowledge beyond those needed for his previous position. He will have supervisory responsibility for the first time, and the industry sectors that he will be covering have expanded. Standard I(E) requires Mahajan to extend his competence to cover all responsibilities of his new role. Through education and self-study, Mahajan endeavors to develop competence for his widening responsibility for research and analysis. However, he does not take steps to obtain the skills and knowledge needed for fulfilling his supervisory responsibility over the other analysts. To do this, he could have taken such steps as attending conferences or taking professional development courses on management, earning compliance credentials, and undergoing internal training from his firm on supervisory responsibility."},{"id":36,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":13,"section":"A. MATERIAL NONPUBLIC INFORMATION","question":"Andrews, a private wealth manager, is conducting interviews for a new research analyst for his firm. One of the candidates is Wright, an analyst with a local investment bank. During the interview, while Wright is describing his analytical skills, he mentions a current merger in which his firm is acting as the adviser. Andrews has heard rumors of a possible merger between the two companies, but no releases have been made by the companies concerned. Which of the following actions by Andrews is least likely a violation of the Code and Standards?","choices":{"A":"Waiting until the next day before trading on the information to allow time for it to become public.17","B":"Notifying all investment managers in his firm of the new information so none of their clients are disadvantaged.","C":"Placing the securities mentioned as part of the merger on the firm’s restricted trading list."},"correct":"C","solution":"C is correct. The guidance to Standard II(A)–Material Nonpublic Information recommends adding securities to the firm’s restricted list when the firm has or may have material nonpublic information. By adding these securities to this list, Andrews would uphold this standard. Because waiting until the next day will not ensure that news of the merger is made public, answer A is incorrect. Negotiations may take much longer between the two companies, and the merger may never happen. Andrews must wait until the information is disseminated to the market before he trades on that information. Answer B is incorrect because Andrews should not disclose the information to other managers; no trading is allowed on material nonpublic information."},{"id":37,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":14,"section":"A. MATERIAL NONPUBLIC INFORMATION","question":"During a round of golf, Rodriguez, chief financial officer of Mega Retail, mentions to Hart, a local investment adviser and long-time personal friend, that Mega is having an exceptional sales quarter. Rodriguez expects the results to be almost 10% above the current estimates. The next day, Hart initiates the purchase of a large stake in the local exchange-traded retail fund for her personal account.","choices":{"A":"Hart violated the Code and Standards by investing in the exchange-traded fund that included Mega Retail.","B":"Hart did not violate the Code and Standards because she did not invest directly in securities of Mega Retail.","C":"Rodriguez did not violate the Code and Standards because the comments made to Hart were not intended to solicit an investment in Mega Retail."},"correct":"A","solution":"A is correct. Hart’s decision to invest in the retail fund appears directly correlated with Rodriguez’s statement about the successful quarter of Mega Retail and thus violates Standard II(A) – Material Nonpublic Information. Rodriguez’s information would be considered material because it would influence the share price of Mega Retail and probably influence the price of the entire exchange-traded retail fund. Thus, answer B is incorrect. Answer C is also incorrect because Rodriguez shared information that was both material and nonpublic. Company officers regularly have such knowledge about their firms, which is not a violation. The sharing of such information, however, even in a conversation between friends, does violate Standard II(A)."},{"id":38,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":15,"section":"A. MATERIAL NONPUBLIC INFORMATION","question":"Nancy McCoy, CFA, is preparing a report on Gourmet Food Mart. As part of her research, she contacts the company's contractors, suppliers, and competitors. McCoy is told by the CEO of a major produce vendor that he is about to file a lawsuit against Gourmet Food Mart, seeking significant damages. McCoy incorporates this information into her research report, which projects a decline in profitability for Gourmet Food Mart due to the impending litigation. According to the CFA Institute Standards of Professional Conduct, McCoy:18","choices":{"A":"has violated the Standards by utilizing material nonpublic information.","B":"has violated the Standards by disseminating confidential information.","C":"has not violated any Standard."},"correct":"A","solution":"A is correct. According to Standard II(A) Material Nonpublic Information, an analyst must not act or cause others to act on material nonpublic information. Information about a significant legal dispute is considered material, and in this case is nonpublic because the lawsuit has not yet been filed and is not yet a matter of public record."},{"id":39,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":16,"section":"B. MARKET MANIPULATION","question":"Mark Williamson is \"bearish\" on ABC Manufacturing Company. Williamson is so convinced that ABC is overpriced, two weeks ago, he shorted 100,000 shares. Today, Williamson is \"surfing\" several popular investment bulletin boards on the internet and posting false derogatory comments about company management. According to Standard II(B), Market Manipulation, Williamson has engaged in:","choices":{"A":"both transaction-based manipulation and information-based manipulation.","B":"transaction-based manipulation, but not information-based manipulation.","C":"information-based manipulation, but not transaction-based manipulation."},"correct":"C","solution":"C is correct. Williamson is in violation of Standard II(B), Market Manipulation, by engaging in information-based manipulation. Information-based manipulation includes, but is not limited to, spreading false rumors about a firm in order to induce others to trade."},{"id":40,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":17,"section":"B. MARKET MANIPULATION","question":"Which of the following is NOT a violation of Standard II(B), Market Manipulation?","choices":{"A":"Entering large offsetting buy and sell orders to inflate trading volume.","B":"Implementing a trading strategy to exploit differences in market power and information.","C":"Overstating an earnings projection in order to increase the price of a stock."},"correct":"B","solution":"B is correct. Standard II(B), Market Manipulation, is not intended to prohibit transactions that are done in order to minimize income taxes or trading strategies that are not intended to distort prices or artificially inflate trading volume. Overstating earnings projections in order to increase the price of a stock is a direct violation."},{"id":41,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":18,"section":"A. LOTALTY, PRUDENCE & CARE","question":"Paul Drake is employed by a company to provide investment advice to participants in the 19 firm's pension plan. Company stock is one of the investment options in the plan. Drake feels that the stock is too risky for employees to own in their pension plan and starts advising them to pull out of the stock. The Treasurer of the company calls Drake and tells him that he will be fired if he continues making such advice because he is violating his fiduciary duty to the company. Drake should:","choices":{"A":"make sell recommendations but point out that the company Treasurer has a differing and valid point of view.","B":"continue to advise employees to sell their stock.","C":"tell employees that he cannot provide advice on company stock because of a conflict of interest"},"correct":"B","solution":"B is correct. Although Drake is paid by the company, his fiduciary duty is to the plan participants. His advice cannot be compromised by business considerations, otherwise he will be violating the Standard on loyalty, prudence, and care."},{"id":42,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":19,"section":"A. LOTALTY, PRUDENCE & CARE","question":"Tony Calaveccio, CFA, is the manager of the TrustCo Small Cap Venture Fund in Toronto. He places trades for the fund with River City Brokerage. River City provides Calaveccio with soft dollars to purchase research. River City also deals in municipal bonds, some of which Calaveccio holds in his personal portfolio He periodically uses the soft dollars to request research reports on various small cap stocks and also on the status of the municipal bond market and issues that he holds. These actions are:","choices":{"A":"in violation of his fiduciary duties regarding the municipal bond research but not so regarding the research on the small cap issues.","B":"not in violation of the Code and Standards.","C":"in violation of his fiduciary duties regarding both the small cap research and the municipal bond research."},"correct":"A","solution":"A is correct. The issue at hand is the member's fiduciary responsibilities in handling \"soft dollars\" which are technically the property of the client. Standard III(A), Loyalty, Prudence, and Care, delineates the member's fiduciary responsibilities with regard to soft dollars. Since municipal bond research is clearly not relevant to the Small Cap Fund holders, he is clearly using the soft dollars to obtain research for his personal benefit and is in violation of the Standard."},{"id":43,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":20,"section":"A. LOTALTY, PRUDENCE & CARE","question":"One of the discretionary accounts managed by Farnsworth is the Jones Corporation employee profit- sharing plan. Jones, the company president, recently asked Farnsworth to vote the shares in the profit-sharing plan in favor of the slate of directors nominated by Jones Corporation and against the directors sponsored by a dissident stockholder group. Farnsworth does not want to lose this account because he directs all the account’s trades to a brokerage firm that provides Farnsworth with useful information about tax-free investments. Although this information is not of value in managing the Jones Corporation account, it does help in managing several other accounts. The 20 brokerage firm providing this information also offers the lowest commissions for trades and provides best execution. Farnsworth investigates the director issue, concludes that the management\u0002nominated slate is better for the long-run performance of the company than the dissident group’s slate, and votes accordingly. Farnsworth:","choices":{"A":"Violated the Standards in voting the shares in the manner requested by Jones but not in directing trades to the brokerage firm.","B":"Did not violate the Standards in voting the shares in the manner requested by Jones or in directing trades to the brokerage firm.","C":"Violated the Standards in directing trades to the brokerage firm but not in voting the shares as requested by Jones."},"correct":"B","solution":"B is correct. Specifically, a member’s or candidate’s responsibility for voting proxies and the use of client brokerage. According to the facts stated in the question, Farnsworth did not violate Standard III(A). Although the company president asked Farnsworth to vote the shares of the Jones Corporation profit-sharing plan a certain way, Farnsworth investigated the issue and concluded, independently, the best way to vote. Therefore, even though his decision coincided with the wishes of the company president, Farnsworth is not in violation of his responsibility to be loyal and to provide care to his clients. In this case, the participants and the beneficiaries of the profit-sharing plan are the clients, not the company’s management. Had Farnsworth not investigated the issue or had he yielded to the president’s wishes and voted for a slate of directors that he had determined was not in the best interest of the company, Farnsworth would have violated his responsibilities to the beneficiaries of the plan. In addition, because the brokerage firm provides the lowest commissions and best execution for securities transactions, Farnsworth has met his obligations to the client in using this brokerage firm. It does not matter that the brokerage firm also provides research information that is not useful for the account generating the commission because Farnsworth is not paying extra money of the client’s for that information."},{"id":44,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":21,"section":"B. FAIR DEALING","question":"Which one of the following actions will help to ensure the fair treatment of brokerage firm clients when a new investment recommendation is made?","choices":{"A":"Informing all people in the firm in advance that a recommendation is to be disseminated.","B":"Distributing recommendations to institutional clients prior to individual accounts.","C":"Minimizing the time between the decision and the dissemination of a recommendation."},"correct":"C","solution":"C is correct. This question, which relates to Standard III(B)–Fair Dealing, tests the knowledge of the procedures that will assist members and candidates in treating clients fairly when making investment recommendations. The step listed in C will help ensure the fair treatment of clients. Answer A may have negative effects on the fair treatment of clients. The more people who know about a pending change, the greater the chance that someone will inform some clients before the information’s release. The firm should establish policies that limit the number of people who are 21 aware in advance that a recommendation is to be disseminated. Answer B, distributing recommendations to institutional clients before distributing them to individual accounts, discriminates among clients on the basis of size and class of assets and is a violation of Standard III(B)."},{"id":45,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":22,"section":"B. FAIR DEALING","question":"Smith, a research analyst with a brokerage firm, decides to change his recommendation for the common stock of Green Company, Inc., from a “buy” to a “sell.” He mails this change in investment advice to all the firm’s clients on Wednesday. The day after the mailing, a client calls with a buy order for 500 shares of Green Company. In this circumstance, Smith should:","choices":{"A":"Accept the order.","B":"Advise the customer of the change in recommendation before accepting the order.","C":"Not accept the order because it is contrary to the firm’s recommendation."},"correct":"B","solution":"B is correct. This question involves Standard III(B)–Fair Dealing. Smith disseminated a change in the stock recommendation to his clients but then received a request contrary to that recommendation from a client who probably had not yet received the recommendation. Prior to executing the order, Smith should take additional steps to ensure that the customer has received the change of recommendation. Answer A is incorrect because the client placed the order prior to receiving the recommendation and, therefore, does not have the benefit of Smith’s most recent recommendation. Answer C is also incorrect; simply because the client request is contrary to the firm’s recommendation does not mean a member can override a direct request by a client. After Smith contacts the client to ensure that the client has received the changed recommendation, if the client still wants to place a buy order for the shares, Smith is obligated to comply with the client’s directive."},{"id":46,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":23,"section":"B. FAIR DEALING","question":"Atlantic Capital Management has access to a limited number of shares in a popular new issue expected to be oversubscribed. Atlantic’s portfolio managers have determined the issue to be a prudent addition within Atlantic’s developing growth equity strategy. A number of the firm’s investment professionals have family-member accounts that are managed to the developing growth strategy. Which of the following allocation options most likely adheres to the Code and Standards? Atlantic should allocate the shares:","choices":{"A":"to family-member accounts only after non-family accounts have been allocated their shares.","B":"on a prorated basis across all developing growth accounts, including the family-member accounts.","C":"on a prorated basis across all developing growth accounts, excluding the family-member accounts."},"correct":"B","solution":"B is correct. Under Standard III(B) if an investment professional’s family member accounts are being managed similarly to other clients of the firm, they should not be excluded from buying such shares as they are considered clients despite their familial relationships.22"},{"id":47,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":24,"section":"B. FAIR DEALING","question":"Henrietta Huerta, CFA, writes a weekly investment newsletter to market her services and obtain new asset management clients. A third party distributes the free newsletter on her behalf to those individuals on its mailing list. As a result, it is widely read by thousands of individual investors. The newsletter recommendations reflect most of Huerta’s investment actions. After completing further research on East- West Coffee Roasters, Huerta decides to change her initial buy recommendation to a sell. To avoid violating the CFA Institute Standards of Professional Conduct it would be most appropriate for Huerta to distribute the new investment recommendation to:","choices":{"A":"newsletter recipients first.","B":"asset management clients first.","C":"newsletter recipients and asset management clients simultaneously."},"correct":"B","solution":"B is correct. According to Standard III(A)–Loyalty, Prudence, and Care, members and candidates must place their clients’ interests first before their own interests. The temptation may be to release the changed recommendation to newsletter recipients simultaneously with or even before the asset management clients to try to obtain new clients. However, to avoid violating Standard III(A)–Loyalty, Prudence, and Care, Huerta must ensure that any change in an investment recommendation is first distributed to her asset management clients before any newsletter recipients, who are not necessarily clients (that is, they receive the newsletter for free from a third party distribution list)."},{"id":48,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":25,"section":"C. SUITABILITY","question":"Emily Wells, CFA, receives an unsolicited trade request from a client that Wells believes is unsuitable based on the client’s investment policy statement (IPS). Wells wishes to discuss this request with the client before executing the trade. The focus of Wells's discussion with the client should most appropriately:","choices":{"A":"be on updating the IPS to reflect a change in the client’s objectives and constraints.","B":"depend on whether the requested trade has a material impact on the client’s portfolio.","C":"be on educating the client about the way in which the requested trade deviates from the IPS."},"correct":"B","solution":"B is correct. According to Standard III(C) – Suitability, the first step to address with an unsolicited trade request is to determine whether the request has a minimum or material impact on entire portfolio."},{"id":49,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":26,"section":"C. SUITABILITY","question":"According to Standard III(C) Suitability, which of the following is least likely to be considered a relevant factor in determining the appropriateness and suitability of investment recommendations or actions for each portfolio or client?","choices":{"A":"Basic characteristics of the total portfolio.23","B":"Needs and circumstances of the portfolio or client.","C":"Best interests of the investment professional."},"correct":"C","solution":"C is correct. Determining appropriateness and suitability focuses on the portfolio or client, not on the investment professional. Investment professionals should take particular care to ensure that their goals in selling products or executing security transactions do not conflict with the best interests of the client."},{"id":50,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":27,"section":"D. PERFORMANCE PRESENTATION","question":"Ned Brenan manages two dozen pension accounts, one of which earned over 25% during the past two years. Brenan tells prospective clients that based on past experience they can expect a 25% return on their funds. Which of the following statements is correct?","choices":{"A":"Brenan has not violated Standard of Professional Conduct III(D), Performance Presentation, but Brenan has violated Standard I(C), Misrepresentation.","B":"Brenan has violated both Standard of Professional Conduct III(D), Performance Presentation, and Standard I(C), Misrepresentation.","C":"Brenan has violated Standard of Professional Conduct III(D), Performance Presentation, but Brenan has not violated Standard I(C), Misrepresentation."},"correct":"B","solution":"B is correct. Brenan violated Standard of Professional Conduct III(D) by using only one portfolio's results to create a false impression of all the portfolios, and Brenan violated Standard of Professional Conduct I(C) by creating the impression that a certain return was assured (he should have used the words \"might\" or \"could\" instead of \"can\")."},{"id":51,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":28,"section":"D. PERFORMANCE PRESENTATION","question":"Hui Chen, CFA, develops marketing materials for an investment fund he founded three years ago. The materials show the 3-year, 2-year, and 1-year returns for the fund. He includes a footnote that states in small print “Past performance does not guarantee future returns.” He does not claim compliance with GIPS in the disclosures or footnotes. He also includes a separate sheet showing the most recent semi-annual and quarterly returns, which notes that they have been neither audited nor verified. Has Chen most likely violated any CFA Institute Standards of Professional Conduct?","choices":{"A":"No.","B":"Yes, because he included un-audited and unverified results.","C":"Yes, because he did not adhere to the Global Investment Performance standards."},"correct":"A","solution":"A is correct. The Standards require members to make reasonable efforts to make sure performance information is fair, accurate, and complete. The Standards do not require compliance with Global Investment Performance Standards (GIPS), auditing, or verification requirements [Standard III(D)]. B is incorrect because the Standards do not require that results be audited or verified unless claiming compliance with GIPS. C is incorrect because the Standards 24 do not require compliance with GIPS."},{"id":52,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":29,"section":"E. PRESERVATION OF CONFIDENTIALITY","question":"Bronson provides investment advice to the board of trustees of a private university endowment fund. The trustees have provided Bronson with the fund’s financial information, including planned expenditures. Bronson receives a phone call on Friday afternoon from Murdock, a prominent alumnus, requesting that Bronson fax him comprehensive financial information about the fund. According to Murdock, he has a potential contributor but needs the information that day to close the deal and cannot contact any of the trustees. Based on the CFA Institute Standards, Bronson should:","choices":{"A":"Send Murdock the information because disclosure would benefit the client.","B":"Not send Murdock the information to preserve confidentiality.","C":"Send Murdock the information, provided Bronson promptly notifies the trustees."},"correct":"B","solution":"B is correct. This question relates to Standard III(A)–Loyalty, Prudence, and Care and Standard III(E)–Preservation of Confidentiality. In this case, the member manages funds of a private endowment. Clients, who are, in this case, the trustees of the fund, must place some trust in members and candidates. Bronson cannot disclose confidential financial information to anyone without the permission of the fund, regardless of whether the disclosure may benefit the fund. Therefore, answer A is incorrect. Answer C is incorrect because Bronson must notify the fund and obtain the fund’s permission before publicizing the information."},{"id":53,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":30,"section":"E. PRESERVATION OF CONFIDENTIALITY","question":"Townsend was recently appointed to the board of directors of a youth golf program that is the local chapter of a national not-for-profit organization. The program is beginning a new fund-raising campaign to expand the number of annual scholarships it provides. Townsend believes many of her clients make annual donations to charity. The next week in her regular newsletter to all clients, she includes a small section discussing the fund-raising campaign and her position on the organization’s board.","choices":{"A":"Townsend did not violate the Code and Standards.","B":"Townsend violated the Code and Standards by soliciting donations from her clients through the newsletter.","C":"Townsend violated the Code and Standards by not getting approval of the organization before soliciting her clients."},"correct":"A","solution":"A is correct. Townsend has not provided any information about her clients to the leaders or managers of the golf program; thus, she has not violated Standard III(E)–Preservation of Confidentiality. Providing contact information about her clients for a direct-mail solicitation would have been a violation. Answer B is incorrect because the notice in the newsletter does not violate Standard III(E). Answer C is incorrect because the golf program’s fund-raising campaign had already begun, so discussing the opportunity to donate was appropriate. 25"},{"id":54,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":31,"section":"A. LOYALTY","question":"Marc Davidson, CFA, works as a trust specialist for Integrity Financial. On his own time, Davidson starts a part time consulting business providing advice to Trustees for a fee. Since this is only part time work, he doesn't inform Integrity of the consulting business. Davidson asks his assistant to compile a list of Integrity’s clients and their contact information. The following month, Davidson is offered a similar role at Integrity’s largest competitor, Legacy Trust Services, Inc. After he begins working at Legacy, his new manager arranges for him to meet with a number of prospective clients, many of whom are clients of Integrity. After meeting with Davidson, a number of former Integrity clients decide to transfer their business to Legacy. Did Davidson’s action violate the Code and Standards?","choices":{"A":"No.","B":"Yes, Davidson’s part time consulting business is a violation of the Standards.","C":"Yes, both Davidson’s part time consulting business and his meetings with Integrity clients are a violation of the Standards."},"correct":"B","solution":"B is correct. because members and candidates are required to disclose any compensation arrangement to their employers that involves performing tasks or services that their employers can charge for. Disclosure is required even if the activities occur during non-work hours. C is incorrect because being hired by a competing firm does not constitute a violation of Standard IV(A). In addition, Davidson is not utilizing confidential information from Integrity to solicit former clients. Although Davidson had a list of client contacts prepared while at Integrity, his new employer arranges the meetings."},{"id":55,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":32,"section":"A. LOYALTY","question":"When Jefferson Piedmont, CFA, joined Branch Investing, Branch began using a quantitative stock selection model Piedmont had developed on his own personal time prior to his employment with Branch. One year later when Piedmont left the firm, he found the original copy of the model he had developed in a file at his home and presented it to his new employer, who immediately began using the model. According to the Standards of Practice Handbook, did Piedmont most likely violate any CFA Institute Standards of Professional Conduct?","choices":{"A":"No.","B":"Yes, because he misappropriated property now belonging to Branch.","C":"Yes, because he failed to inform his new employer the model was the same one used by his previous employer."},"correct":"A","solution":"A is correct. although departing employees may not take employer property when departing [Standard IV(A)–Duties to Employers (Loyalty)], the model Piedmont presented to his new employer was not Branch’s property. It was created by Piedmont prior to his employment with Branch. The model was not created for Branch in the course of his employment, but was adopted 26 by Branch."},{"id":56,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":33,"section":"A. LOYALTY","question":"Bob Douglas, CFA, is considering leaving his current employer to compete in the same field. He did not sign a non-compete clause when he was hired. According to the Code and Standards, he may:","choices":{"A":"begin competing with his current employer as long as the employer has been informed of Douglas' intentions.","B":"not begin competing or not prepare to begin competing until his resignation becomes effective.","C":"prepare to compete with his current employer, but not begin competing until his resignation is effective."},"correct":"C","solution":"C is correct. Douglas may plan and prepare to compete with his current employer, but may not begin competing until his resignation is effective or he gets permission from his employer. Standard IV(A) Loyalty states that when members and candidates are leaving an employer, they must act in the employer's interests until their separation becomes effective."},{"id":57,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":34,"section":"A. LOYALTY","question":"Thomas Turkman recently hired Georgia Viggen, CFA, as a portfolio manager for North South Bank. Although Viggen worked many years for a competitor, West Star Bank, the move was straightforward since she did not have a non-compete agreement with her previous employer. Once Viggen starts working for Turkman, the first thing she does is to bring a trading software package she developed and used at West Star to her new employer. Using public information, Viggen contacts all of her former clients to convince them to move with her to North South. Viggen also convinces one of the analysts she worked with at West Star to join her at her new employer. Viggen most likely violated the CFA Institute Code of Ethics and Standards of Professional Conduct concerning her actions involving:","choices":{"A":"clients.","B":"the analyst.","C":"trading software."},"correct":"C","solution":"C is correct. The portfolio manager violated Standard IV(A)–Loyalty by taking proprietary trading software from her former employer. Although the manager created the software, it was during a period of time when West Star employed her, so the software is not her property to take with her to her new employer. The member contacted clients using public information, so she did not violate Standard IV(A)–Loyalty. Because Viggen was not obligated to abide by a non\u0002compete agreement that would likely restrict recruitment of former colleagues, Viggen is most likely free to recruit the analyst from his former employer."},{"id":58,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":35,"section":"B. ADDITIONAL COMPENSATION ARRANGEMENTS","question":"Jurgen is a portfolio manager. One of her firm’s clients has told Jurgen that he will 27 compensate her beyond the compensation provided by her firm on the basis of the capital appreciation of his portfolio each year. Jurgen should:","choices":{"A":"Turn down the additional compensation because it will result in conflicts with the interests of other clients’ accounts.","B":"Disclose to her employer and then accept the compensation arrangement.","C":"Obtain permission from her employer prior to accepting the compensation arrangement."},"correct":"C","solution":"C is correct. This question involves Standard IV(B)–Additional Compensation Arrangements. The arrangement described in the question—whereby Jurgen would be compensated beyond the compensation provided by her firm, on the basis of an account’s performance—is not a violation of the Standards as long as Jurgen discloses the arrangement in writing to her employer and obtains permission from her employer prior to entering into the arrangement. Answers A and B are incorrect; although the private compensation arrangement could conflict with the interests of other clients and lead to short-term performance pressures, members and candidates may enter into such agreements as long as they have disclosed the arrangements to their employer and obtained permission for the arrangement from their employer."},{"id":59,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":36,"section":"B. ADDITIONAL COMPENSATION ARRANGEMENTS","question":"An analyst needs to inform his supervisor in writing of which of the following?","choices":{"A":"A client and the analyst alternate paying for lunch at a local sandwich shop.","B":"An annual bonus, sent to the analyst by a client, which varies with the performance of the client's portfolio that the analyst manages as an employee even though no verbal or written agreement exists about the bonus.","C":"Both the lunch and the bonus mentioned in the other answers."},"correct":"B","solution":"B is correct. Standard IV(B) requires that members disclose to their employer in writing all benefits that they receive in addition to their regular compensation for services they perform on behalf of their employer. Since the bonus varies with the performance of the client's portfolio, there is a clear link to the services of the analyst. The analyst is not required to report the lunch since it is not linked to performance."},{"id":60,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":37,"section":"C. RESPONSIBILIES TO SUPERVISORS","question":"Madeline Smith, CFA, was recently promoted to senior portfolio manager. In her new position, Smith is required to supervise three portfolio managers. Smith asks for a copy of her firm’s written supervisory policies and procedures, but is advised that no such policies are required by regulatory standards in the country where Smith works. According to the Standards of Practice Handbook, Smith’s most appropriate course of action would be to:","choices":{"A":"require her firm to adopt the CFA Institute Code of Ethics and Standards of Professional Conduct.","B":"require the employees she supervises to adopt the CFA Institute Code of Ethics and Standards of Professional Conduct.28","C":"decline to accept supervisory responsibility until her firm adopts procedures to allow her to adequately exercise such responsibility."},"correct":"C","solution":"C is correct. If a member cannot fulfill supervisory responsibilities because of the absence of a compliance system or because of an inadequate compliance system, the member should decline in writing to accept supervisory responsibility until the firm adopts reasonable procedures to allow the member to adequately exercise such responsibility [Standard IV(C)]."},{"id":61,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":38,"section":"C. RESPONSIBILIES TO SUPERVISORS","question":"Francesca Ndenda, CFA, and Grace Rutabingwa work in the same department for New Age Managers with Rutabingwa reporting to Ndenda. Ndenda learns that Rutabingwa received a Notice of Enquiry from the Professional Conduct Program at CFA Institute regarding a potential cheating violation when he sat for the CFA exam in June. As Rutabingwa’s supervisor, Ndenda is afraid the behavior of Rutabingwa will be seen as a violation of the CFA Code and Standards. Does Ndenda most likely have cause for concern?","choices":{"A":"Yes.","B":"No, because her responsibilities do not apply.","C":"No, not until Rutabingwa is found guilty of cheating."},"correct":"B","solution":"B is correct. A supervisor’s responsibilities relate to detecting and preventing violations by anyone subject to their supervision or authority regarding activities they supervise. Ndenda had no way of detecting and/or preventing Rutabingwa from cheating during the CFA exam, if in fact that is what he did, an event she did not attend."},{"id":62,"module":3,"moduleTitle":"GUIDANCE FOR STANDARD I – VII","qnum":39,"section":"C. RESPONSIBILIES TO SUPERVISORS","q
