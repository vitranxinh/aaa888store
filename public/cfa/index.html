<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#f5f7fb"><title>CFA Level I Mobile Practice</title><style>:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e5e9f1;--blue:#1677ff;--blue2:#e9f2ff;--good:#178a54;--goodbg:#eaf8f1;--bad:#c63838;--badbg:#fff0f0;--warn:#a26500;--shadow:0 8px 30px rgba(35,54,90,.08);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Segoe UI,Arial,sans-serif}
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--text);min-height:100%;-webkit-text-size-adjust:100%} body{overscroll-behavior-y:none} button,input{font:inherit} button{cursor:pointer}
.app{min-height:100dvh;max-width:520px;margin:0 auto;padding:env(safe-area-inset-top) 14px calc(86px + env(safe-area-inset-bottom))}
.topbar{height:58px;display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top);z-index:10;background:rgba(245,247,251,.94);backdrop-filter:blur(16px)}
.iconbtn{border:0;background:#fff;width:42px;height:42px;border-radius:13px;box-shadow:0 2px 10px rgba(30,50,80,.06);font-size:21px;color:var(--text)}
.titlewrap{min-width:0;flex:1}.eyebrow{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.03em}.title{font-size:20px;font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{padding:18px 4px 12px}.hero h1{font-size:29px;line-height:1.08;margin:0 0 7px;letter-spacing:-.5px}.hero p{margin:0;color:var(--muted);font-size:15px;line-height:1.45}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 18px}.metric{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 10px;text-align:center}.metric b{display:block;font-size:20px}.metric span{font-size:11px;color:var(--muted)}
.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 10px}.sectionhead h2{font-size:17px;margin:0}.sectionhead button{border:0;background:none;color:var(--blue);font-weight:700}
.subjects{display:grid;gap:10px}.subject{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:15px;text-align:left;box-shadow:0 3px 14px rgba(30,50,80,.03)}.subject:active{transform:scale(.99)}
.subjecttop{display:flex;gap:12px;align-items:center}.subjecticon{width:43px;height:43px;border-radius:13px;background:var(--blue2);display:grid;place-items:center;font-weight:900;color:var(--blue);font-size:17px}.subjectname{font-size:16px;font-weight:800;flex:1}.count{font-size:12px;color:var(--muted)}
.progressline{height:6px;background:#edf0f5;border-radius:999px;margin-top:12px;overflow:hidden}.progressline>i{display:block;height:100%;background:var(--blue);border-radius:999px}.submeta{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:6px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick button{border:0;border-radius:17px;padding:15px 13px;text-align:left;background:var(--text);color:#fff;min-height:77px}.quick button.secondary{background:#fff;color:var(--text);border:1px solid var(--line)}.quick b{display:block;font-size:15px;margin-bottom:4px}.quick span{font-size:12px;opacity:.75}
.toolbar{display:flex;gap:8px;overflow:auto;padding:7px 0 12px;scrollbar-width:none}.toolbar::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-size:13px;font-weight:700;color:var(--muted)}.chip.active{background:var(--text);color:#fff;border-color:var(--text)}
.qmeta{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px;margin:4px 3px 8px}.qprogress{height:5px;background:#e5e9f1;border-radius:999px;overflow:hidden;margin-bottom:12px}.qprogress i{display:block;height:100%;background:var(--blue)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:18px 16px}.qtext{white-space:pre-wrap;font-size:16px;line-height:1.52;font-family:inherit;margin:0;color:#1e293b}.qtext .qnum{font-weight:900}
.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 0}.ansbtn{height:54px;border-radius:15px;border:1.5px solid #dfe4ec;background:#fff;font-size:18px;font-weight:900;color:#344054}.ansbtn.selected{border-color:var(--blue);background:var(--blue2);color:var(--blue)}.ansbtn.correct{border-color:var(--good);background:var(--goodbg);color:var(--good)}.ansbtn.wrong{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.result{margin-top:14px;border-radius:15px;padding:13px 14px;font-size:14px;line-height:1.5}.result.good{background:var(--goodbg);color:#145c3b}.result.bad{background:var(--badbg);color:#8f2b2b}.result.neutral{background:#f3f5f8;color:#48556a}.result b{display:block;margin-bottom:4px}.explanation{white-space:pre-wrap;margin-top:7px;color:#344054}.source{display:inline-flex;margin-top:11px;color:var(--blue);font-weight:700;text-decoration:none;font-size:13px}
.stickybottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(245,247,251,.95);backdrop-filter:blur(18px);z-index:20;display:grid;grid-template-columns:1fr 1.4fr;gap:10px}.stickybottom button{height:52px;border-radius:15px;border:1px solid var(--line);background:#fff;font-weight:800}.stickybottom .primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.flagbtn{border:0;background:none;font-size:22px;padding:6px}.empty{padding:50px 20px;text-align:center;color:var(--muted)}
.modalback{position:fixed;inset:0;background:rgba(14,24,41,.35);z-index:40;display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(520px,100%);background:#fff;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:82dvh;overflow:auto}.sheet h3{margin:0 0 12px}.sheet p{color:var(--muted);line-height:1.5}.sheet button.full{width:100%;height:50px;border-radius:14px;border:0;background:var(--text);color:#fff;font-weight:800}.sheet .row{display:flex;gap:8px;flex-wrap:wrap}.sheet .row button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-weight:700}
.mockgrid{display:grid;gap:10px}.mockgrid button{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;font-weight:800}.mockgrid small{display:block;color:var(--muted);font-weight:500;margin-top:4px}
@media(min-width:480px){.app{padding-left:18px;padding-right:18px}.hero h1{font-size:31px}.card{padding:20px}.qtext{font-size:17px}}
@media(prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#171e2c;--text:#f2f5f9;--muted:#9aa6b6;--line:#273246;--blue2:#132a4b;--shadow:none}.topbar,.stickybottom{background:rgba(15,20,32,.94)}.iconbtn,.subject,.metric,.card,.chip,.ansbtn,.stickybottom button,.quick button.secondary,.mockgrid button{background:var(--card);color:var(--text)}.qtext,.explanation{color:#e8edf4}.ansbtn{border-color:#334158}.progressline{background:#273246}.qprogress{background:#273246}.result.neutral{background:#222b3b;color:#c8d1de}.sheet{background:#171e2c}.sheet .row button{background:#1e2736;color:#fff;border-color:#334158}}
</style></head><body><div id="app"><main class="app"><section class="hero"><h1>CFA Mobile Practice</h1><p>Loading questions…</p></section></main></div><script>(async()=>{try{const p=await Promise.all(Array.from({length:16},(_,i)=>fetch('https://raw.githubusercontent.com/vitranxinh/aaa888store/cfa-mobile-practice-data/cfa-mobile-practice-data/d'+i+'.txt').then(r=>{if(!r.ok)throw new Error('data '+i);return r.text()})));const x=Uint8Array.from(atob(p.join('')),c=>c.charCodeAt(0));const t=await new Response(new Blob([x]).stream().pipeThrough(new DecompressionStream('gzip'))).text();window.CFA_QUESTIONS=JSON.parse(t);(()=>{
window.addEventListener('error',()=>{const a=document.getElementById('app');if(a && !a.textContent.trim()) a.innerHTML='<main class="app"><section class="hero"><h1>Quiz could not load</h1><p>Open this file in Safari. The Files preview on iPhone may block interactive JavaScript.</p></section></main>'});
const Q=window.CFA_QUESTIONS||[];
const app=document.getElementById('app');
const KEY='cfa_mobile_progress_v1', LAST='cfa_mobile_last_v1';
const store=(()=>{try{const k='__cfa_test__';localStorage.setItem(k,'1');localStorage.removeItem(k);return localStorage}catch(e){return {getItem:()=>null,setItem:()=>{},removeItem:()=>{}}}})();
let progress={}; let last={};
try{progress=JSON.parse(store.getItem(KEY)||'{}')}catch(e){progress={}}
try{last=JSON.parse(store.getItem(LAST)||'{}')}catch(e){last={}}
let view={screen:'home',subject:null,filter:'all',queue:[],idx:0,mode:'practice',mockAnswers:{},mockDone:false};
const subjectOrder=['Quantitative Methods','Economics','Financial Statement Analysis','Corporate Issuers','Equity Investments','Fixed Income','Derivatives','Alternative Investments','Portfolio Management','Ethical and Professional Standards'];
const abbr={'Quantitative Methods':'QM','Economics':'EC','Financial Statement Analysis':'FSA','Corporate Issuers':'CI','Equity Investments':'EQ','Fixed Income':'FI','Derivatives':'DR','Alternative Investments':'AI','Portfolio Management':'PM','Ethical and Professional Standards':'ETH'};
const esc=s=>(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{store.setItem(KEY,JSON.stringify(progress))}catch(e){}};
const p=q=>progress[q.id]||{};
const answered=q=>!!p(q).answer;
const isCorrect=q=>p(q).correct===true;
const wrong=q=>answered(q)&&p(q).correct===false;
const flagged=q=>!!p(q).flagged;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function filtered(base,filter){if(filter==='unanswered')return base.filter(q=>!answered(q));if(filter==='wrong')return base.filter(wrong);if(filter==='flagged')return base.filter(flagged);return base}
function stats(base){let a=base.filter(answered).length,c=base.filter(isCorrect).length,w=base.filter(wrong).length,f=base.filter(flagged).length,ka=base.filter(q=>answered(q)&&q.correct).length;return{a,c,w,f,ka,total:base.length}}
function cleanExp(q){let s=q.explanation||'';s=s.replace(/^\s*[ABC8]?[\.,)]?[^\n]*\n?/,'');s=s.replace(/Feedback/ig,'').replace(/Based on your answer/ig,'').replace(/\n{3,}/g,'\n\n').trim();return s||q.answer||'Answer explanation unavailable from the scan.'}
function header(title,eye,back=true,right=''){return `<div class="topbar">${back?'<button class="iconbtn" data-act="home">‹</button>':''}<div class="titlewrap"><div class="eyebrow">${esc(eye||'')}</div><div class="title">${esc(title)}</div></div>${right}</div>`}
function renderHome(){view.screen='home';let st=stats(Q);let pct=st.ka?Math.round(st.c/st.ka*100):0;app.innerHTML=`<main class="app"><div class="topbar"><div class="titlewrap"><div class="eyebrow">MOBILE PRACTICE</div><div class="title">CFA Level I</div></div><button class="iconbtn" data-act="info">⋯</button></div><section class="hero"><h1>Practice anywhere.</h1><p>Built for iPhone 14 Plus. Your answers, wrong questions and flags are saved on this device.</p></section><div class="summary"><div class="metric"><b>${st.a}</b><span>Answered</span></div><div class="metric"><b>${pct}%</b><span>Accuracy</span></div><div class="metric"><b>${st.f}</b><span>Flagged</span></div></div><div class="sectionhead"><h2>Quick practice</h2></div><div class="quick"><button data-act="mixed"><b>Mixed 30</b><span>Random questions across topics</span></button><button class="secondary" data-act="wrongall"><b>Wrong only</b><span>${st.w} questions to retry</span></button></div><div class="sectionhead"><h2>Topics</h2><button data-act="resetask">Reset</button></div><div class="subjects">${subjectOrder.map(s=>subjectCard(s)).join('')}</div></main>`}
function subjectCard(s){let base=Q.filter(q=>q.subject===s),st=stats(base),pc=st.total?Math.round(st.a/st.total*100):0;return `<button class="subject" data-subject="${esc(s)}"><div class="subjecttop"><div class="subjecticon">${abbr[s]||s.slice(0,2)}</div><div class="subjectname">${esc(s)}</div><div class="count">${st.total} Q</div></div><div class="progressline"><i style="width:${pc}%"></i></div><div class="submeta"><span>${st.a} answered</span><span>${st.w} wrong</span></div></button>`}
function openSubject(s,filter='all'){view={...view,screen:'quiz',subject:s,filter,mode:'practice',mockDone:false};let base=s==='__ALL__'?Q:Q.filter(q=>q.subject===s);view.queue=filtered(base,filter);let key=s+'|'+filter;view.idx=Math.min(last[key]||0,Math.max(0,view.queue.length-1));renderQuiz()}
function openMixed(){view={...view,screen:'quiz',subject:'__MIXED__',filter:'all',mode:'practice',mockDone:false};view.queue=shuffle(Q).slice(0,30);view.idx=0;renderQuiz()}
function renderQuiz(){if(!view.queue.length){app.innerHTML=`<main class="app">${header(view.subject==='__ALL__'?'Wrong questions':view.subject==='__MIXED__'?'Mixed 30':view.subject,'PRACTICE')}<div class="empty"><h3>Nothing here</h3><p>Try another filter.</p></div></main>`;return}let q=view.queue[view.idx],rec=p(q),known=!!q.correct,done=!!rec.answer;let title=view.subject==='__MIXED__'?'Mixed 30':view.subject==='__ALL__'?'Wrong questions':view.subject;let filters=view.subject!=='__MIXED__'&&view.subject!=='__ALL__'?`<div class="toolbar">${['all','unanswered','wrong','flagged'].map(f=>`<button class="chip ${view.filter===f?'active':''}" data-filter="${f}">${f==='all'?'All':f==='unanswered'?'Unanswered':f==='wrong'?'Wrong':'Flagged'}</button>`).join('')}</div>`:'';let pct=Math.round((view.idx+1)/view.queue.length*100);let result='';if(done){if(known){let good=rec.correct;result=`<div class="result ${good?'good':'bad'}"><b>${good?'Correct':'Incorrect'} · Answer ${esc(q.correct)}</b><div class="explanation">${esc(cleanExp(q))}</div>${sourceLink(q)}</div>`}else{result=`<div class="result neutral"><b>Selected ${esc(rec.answer)} · scan answer: ${esc(q.answer||'not detected')}</b><div class="explanation">${esc(cleanExp(q))}</div>${sourceLink(q)}</div>`}}else if(!known){result=`<div class="result neutral"><b>OCR note</b>The answer letter could not be read reliably. Choose an option, then the scanned answer/explanation will be shown.</div>`}
app.innerHTML=`<main class="app">${header(title, q.subject, true, `<button class="flagbtn" data-act="flag">${flagged(q)?'★':'☆'}</button>`)}${filters}<div class="qmeta"><span>Question ${q.number}</span><span>${view.idx+1} / ${view.queue.length}</span></div><div class="qprogress"><i style="width:${pct}%"></i></div><section class="card"><pre class="qtext">${esc(q.question)}</pre><div class="answers">${['A','B','C'].map(a=>answerButton(q,a,rec)).join('')}</div>${result}</section></main><div class="stickybottom"><button data-act="prev" ${view.idx===0?'disabled':''}>Previous</button><button class="primary" data-act="next">${view.idx===view.queue.length-1?'Finish':'Next'}</button></div>`}
function answerButton(q,a,rec){let cls='ansbtn';if(rec.answer===a)cls+=' selected';if(rec.answer&&q.correct){if(a===q.correct)cls+=' correct';else if(rec.answer===a)cls+=' wrong'}return `<button class="${cls}" data-answer="${a}">${a}</button>`}
function sourceLink(q){return q.page?`<span class="source">Original scan: PDF page ${q.page}</span>`:''}
function answer(a){let q=view.queue[view.idx];let corr=q.correct? a===q.correct : null;progress[q.id]={...(progress[q.id]||{}),answer:a,correct:corr};save();renderQuiz()}
function move(d){let n=view.idx+d;if(n<0)return;if(n>=view.queue.length){renderHome();return}view.idx=n;if(view.subject!=='__MIXED__'){last[(view.subject)+'|'+view.filter]=view.idx;store.setItem(LAST,JSON.stringify(last))}renderQuiz();window.scrollTo(0,0)}
function setFilter(f){let s=view.subject;openSubject(s,f)}
function toggleFlag(){let q=view.queue[view.idx];progress[q.id]={...(progress[q.id]||{}),flagged:!flagged(q)};save();renderQuiz()}
function info(){showSheet(`<h3>Use it like an app</h3><p>On iPhone: open this site in Safari → Share → <b>Add to Home Screen</b>. Your progress stays in Safari/local storage. The original scan is available from each question when needed.</p><button class="full" data-act="close">Done</button>`)}
function resetAsk(){showSheet(`<h3>Reset progress?</h3><p>This clears answers and flags saved on this device.</p><div class="row"><button data-act="close">Cancel</button><button data-act="reset">Reset everything</button></div>`)}
function showSheet(inner){document.body.insertAdjacentHTML('beforeend',`<div class="modalback" id="sheet"><div class="sheet">${inner}</div></div>`)}
function closeSheet(){document.getElementById('sheet')?.remove()}
function reset(){progress={};save();closeSheet();renderHome()}
app.addEventListener('click',e=>{let t=e.target.closest('[data-act],[data-subject],[data-answer],[data-filter]');if(!t)return;if(t.dataset.subject)return openSubject(t.dataset.subject);if(t.dataset.answer)return answer(t.dataset.answer);if(t.dataset.filter)return setFilter(t.dataset.filter);let a=t.dataset.act;if(a==='home')renderHome();else if(a==='mixed')openMixed();else if(a==='wrongall'){view.subject='__ALL__';view.filter='wrong';view.queue=Q.filter(wrong);view.idx=0;view.screen='quiz';renderQuiz()}else if(a==='prev')move(-1);else if(a==='next')move(1);else if(a==='flag')toggleFlag();else if(a==='info')info();else if(a==='resetask')resetAsk();else if(a==='close')closeSheet();else if(a==='reset')reset()});

renderHome();
})();
}catch(e){document.getElementById('app').innerHTML='<main class="app"><section class="hero"><h1>Quiz could not load</h1><p>Please refresh the page.</p></section></main>';console.error(e)}})();</script></body></html>
